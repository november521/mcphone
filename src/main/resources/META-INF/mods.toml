modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# 描述写在这儿而不是 gradle.properties —— 那个文件按规范是 ISO-8859-1 解码的，
# 中文放进去取出来就是乱码。理由写在 gradle.properties 里那段注释
description='''
把一部能用的智能手机塞进 Minecraft —— 拍照、翻相册、换壁纸、听歌、装 App，
还能给自己那一部手机起个名。

【这一支是从 Minecraft 1.21.1 + NeoForge 移植过来的，基本功能已就位；
传送石与浏览器两个联动尚未接入。】
'''

# 版本范围从 gradle.properties 来，不写死在这儿：两处各写一份必然会漂，
# 而漂了的后果是"玩家装的 Forge 明明够新，却被拦下"这种最难查的状态。
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

# 可选联动。mandatory=false 表示"装了就用，没装照跑"，
# ordering=AFTER 是【必须的】：我们在自己的构造期就要问 ModList 它在不在，
# 装载顺序若排在它前面，那一问会得到假。漏了这几段不报错，
# 症状是"明明装了 Curios，手机却挂不上饰品栏"。
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.14.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="netmusic"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="patchouli"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
