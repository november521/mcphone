name: Backfill platforms

# 【一次性的补发工具，用完就删】。
#
# 起因：1.20.1-forge 那一支的 forge-v0.10.2 是在两个平台接上【之前】发的，
# 所以它只有 GitHub Release，Modrinth 与 CurseForge 上都没有。
#
# 不能靠重推 tag 补：release.yml 会先删掉再重建 GitHub Release，把一个
# 已经在外面挂了一周的发布页换掉，只为补两个平台，代价不对等。
#
# 与上一版补发工具（backfill-curseforge.yml，已删）的区别：那一版重新编译，
# 这一版【直接下 GitHub Release 上的 jar】。理由是这一版已经发出去一周，
# 重编等于赌构建可复现（依赖解析、jarJar 内嵌都可能变），而补发要的恰恰是
# "平台上那个文件 = 玩家已经在 GitHub 上拿到的那个"。顺带省掉一次构建。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要补发的 tag
        required: true
        default: forge-v0.10.2

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      # 只为拿 gradle.properties 与 release-notes，不构建，所以浅检出即可。
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Download the released JAR
        id: jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')

          # tag 与这个 commit 里的 mod_version 必须对得上，否则版本号会与
          # 文件内容不符 —— 平台上没有任何东西会告诉你这一点。
          # 这一支的 tag 带 forge- 前缀，main 那支不带，两种都认。
          EXPECTED="${{ inputs.tag }}"
          if [ "$EXPECTED" != "forge-v$MOD_VERSION" ] && [ "$EXPECTED" != "v$MOD_VERSION" ]; then
            echo "::error::tag $EXPECTED 与这个 commit 里的 mod_version=$MOD_VERSION 对不上"
            exit 1
          fi

          # 【按确切文件名下载，不要 --pattern '*.jar'】。理由与 release.yml
          # 里那条一样：jarJar 会额外出一个不含内嵌 JavaMP3 的 -slim，
          # 玩家下到它的表现是"放 mp3 必崩"，而补发全绿。
          JAR="mcphone-${MOD_VERSION}.jar"
          mkdir -p dist
          gh release download "$EXPECTED" --pattern "$JAR" --dir dist
          [ -f "dist/$JAR" ] || { echo "::error::没下到 dist/$JAR"; ls -la dist; exit 1; }
          echo "取到 $(ls -l "dist/$JAR" | awk '{print $5}') 字节：$JAR"

          echo "path=dist/$JAR"        >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "mc_version=$MC_VERSION"   >> "$GITHUB_OUTPUT"

      - name: Prepare changelog
        id: changelog
        run: |
          NOTES_FILE="docs/release-notes/${{ inputs.tag }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="publish-changelog.md"
            echo "完整更新内容见 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.tag }}" > "$NOTES_FILE"
            echo "::warning::未找到 docs/release-notes/${{ inputs.tag }}.md，两个平台的更新日志只会有一条 Release 链接"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # 两个平台都 continue-on-error，再由最后一步统一判成败。
      # 不这么写的话，先跑的那个一失败，后面那个直接不跑 —— 而这两件事
      # 之间没有任何依赖关系，一个平台的问题不该让另一个也补不上。
      - name: Publish to CurseForge
        id: cf
        continue-on-error: true
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: MCphone Forge 1.20.1 v${{ steps.jar.outputs.mod_version }}
          version: ${{ steps.jar.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.changelog.outputs.file }}
          loaders: forge
          game-versions: ${{ steps.jar.outputs.mc_version }}
          java: 17
          # 与 release.yml 同一个理由：CurseForge 把不认识的 modId 原样当 slug
          # 提交，slug 不存在就整次上传失败。刻意声明为空。
          dependencies: ''

      - name: Publish to Modrinth
        id: mr
        continue-on-error: true
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # 【不传 github-token】：Release 已经存在，不让它插手。
          files: ${{ steps.jar.outputs.path }}
          name: MCphone Forge 1.20.1 v${{ steps.jar.outputs.mod_version }}
          version: ${{ steps.jar.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.changelog.outputs.file }}
          loaders: forge
          game-versions: ${{ steps.jar.outputs.mc_version }}
          java: 17
          # 依赖不写，让它从 jar 里的 mods.toml 自己读 —— Modrinth 查不到的
          # 依赖会被 filter 掉，不连累上传。

      - name: Summary
        run: |
          echo "CurseForge : ${{ steps.cf.outcome }}"
          echo "Modrinth   : ${{ steps.mr.outcome }}"
          FAILED=0
          [ "${{ steps.cf.outcome }}" = "success" ] || { echo "::error::CurseForge 没补上"; FAILED=1; }
          [ "${{ steps.mr.outcome }}" = "success" ] || { echo "::error::Modrinth 没补上"; FAILED=1; }
          exit $FAILED
