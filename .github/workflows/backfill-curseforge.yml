name: Backfill CurseForge

# 【一次性的补发工具，用完就删】。
#
# 起因：CurseForge 是在 v1.8.19 发出去【之后】才接上的，所以那一版在
# GitHub 和 Modrinth 上都有、唯独 CurseForge 上没有。
#
# 不能靠重推 tag 补：release.yml 会连 Modrinth 一起再发一遍，而 1.8.19 在
# 那边已经存在，mc-publish 会撞上"版本号已存在"直接失败 —— 而它排在
# CurseForge 那步之前，失败之后后面整个不跑，等于什么也没补上。
#
# 所以这里只做一件事：把指定 tag 的 jar 发到 CurseForge，别的一概不碰。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要补发的 tag（这一支用 v<版本>）
        required: true
        default: v1.8.19

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      # 【检出那个 tag，不是 main】。补发的是当时那个版本，用 main 的代码
      # 编出来的 jar 与玩家在 GitHub Release 上下到的不是同一个文件。
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find built JAR
        id: find-jar
        run: |
          # 与 release.yml 同一套：按确切文件名取，不要 find | head -1。
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          if [ "v$MOD_VERSION" != "${{ inputs.tag }}" ]; then
            echo "::error::tag ${{ inputs.tag }} 与这个 commit 里的 mod_version=$MOD_VERSION 对不上"
            exit 1
          fi
          JAR_PATH="build/libs/mcphone-${MOD_VERSION}.jar"
          [ -f "$JAR_PATH" ] || { echo "::error::没找到 $JAR_PATH"; ls -la build/libs; exit 1; }
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog
        id: changelog
        run: |
          NOTES_FILE="docs/release-notes/${{ inputs.tag }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="build/publish-changelog.md"
            echo "完整更新内容见 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.tag }}" > "$NOTES_FILE"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # 只给 CurseForge 的凭据。mc-publish 只往"id 与 token 都齐了"的平台发，
      # 所以 Modrinth 和 GitHub 都不会被碰到。
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.find-jar.outputs.jar_path }}
          name: MCphone NeoForge 1.21.1 ${{ inputs.tag }}
          version: ${{ steps.find-jar.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.changelog.outputs.file }}
          loaders: neoforge
          game-versions: ${{ steps.find-jar.outputs.mc_version }}
          java: 21
          # 与 release.yml 同一个理由：CurseForge 把不认识的 modId 原样当 slug
          # 提交，slug 不存在就整次上传失败。刻意声明为空。
          dependencies: ''
