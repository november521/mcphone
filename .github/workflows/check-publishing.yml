name: Check publishing credentials

# 手动触发，发版【之前】跑一次，确认两个平台的凭据还有效、我们声称的版本名
# 在对方的表里都能对上。
#
# 为什么做成一个 workflow 而不是在本地跑：要验证令牌就得用它，而用它的地方
# 应该是它已经在的地方。令牌全程留在 GitHub，不必为了一次检查把它拷来拷去。
#
# 这不是发版流程的一环，release.yml 不依赖它。它治的是另一件事：令牌会过期、
# 会被吊销，而那件事只会在你推了 tag、构建跑完之后才暴露出来。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 一个都不 echo 令牌本身。curl 走请求头而不是 query string —— 后者会
      # 出现在日志、代理和对方的访问日志里。
      - name: Modrinth
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_ID" ] || [ -z "$MODRINTH_TOKEN" ]; then
            echo "::warning::Modrinth 未配置，跳过"; exit 0
          fi
          UA="november521/mcphone (credential check)"
          USER=$(curl -sS --fail-with-body -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $UA" \
                 https://api.modrinth.com/v2/user | python3 -c 'import sys,json;print(json.load(sys.stdin)["username"])') || {
            echo "::error::Modrinth 令牌无效或已过期"; exit 1; }
          echo "令牌有效，账号 $USER"
          TITLE=$(curl -sS --fail-with-body -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $UA" \
                  "https://api.modrinth.com/v2/project/$MODRINTH_ID" \
                  | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["title"],"/",d["slug"],"/",d["status"])') || {
            echo "::error::MODRINTH_ID=$MODRINTH_ID 取不到项目"; exit 1; }
          echo "项目 $TITLE"

      # ↓↓↓ 临时诊断步骤，查清 403 的来源之后就删掉 ↓↓↓
      - name: DIAG
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          probe() {
            echo "--- $1 ---"
            shift
            CODE=$(curl -sS -o body.txt -w '%{http_code}' "$@" -H "X-Api-Token: $CURSEFORGE_TOKEN")
            echo "HTTP $CODE"
            echo "body: $(head -c 400 body.txt)"
            echo
          }
          # 1) 我们的项目，本地化导出
          probe "localization/export @ $CURSEFORGE_ID (我们的)" \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_ID/localization/export"
          # 2) 一个必然不存在的 ID —— 用来看这个端点区不区分"不存在"和"没权限"
          probe "localization/export @ 999999999 (不存在)" \
            "https://minecraft.curseforge.com/api/projects/999999999/localization/export"
          # 3) JEI 的项目 ID，确实存在但绝不是我们的
          probe "localization/export @ 238222 (JEI，别人的)" \
            "https://minecraft.curseforge.com/api/projects/238222/localization/export"
          # 4) 真正要紧的那个端点：不带任何 body 的 upload-file。
          #    body 不合法必定失败，我们看的是【失败在哪一层】：
          #    404/403 是项目层面的问题，400/422 说明项目和权限都对、只是数据不对。
          probe "upload-file @ $CURSEFORGE_ID (无 body)" -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_ID/upload-file"
          probe "upload-file @ 238222 (无 body，别人的)" -X POST \
            "https://minecraft.curseforge.com/api/projects/238222/upload-file"

      - name: CurseForge
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # 【令牌与 ID 分开判】。验令牌、查版本表都不需要项目 ID，把两者
          # 绑在一起判，就会在"令牌配好了、ID 还没填"这个最需要检查的时刻
          # 什么都不查。
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::warning::CURSEFORGE_TOKEN 没配，跳过"; exit 0
          fi
          if [ -z "$CURSEFORGE_ID" ]; then
            echo "::warning::CURSEFORGE_ID 还没填，发版时 CurseForge 那步仍会跳过。下面只验令牌与版本表。"
          else
            # 用 localization/export 验项目 ID。
            #
            # 上传 API 没有"取项目"这种端点，但这一个是【项目作用域的 GET】，
            # 参数全可选，返回的东西我们也不关心 —— 关心的是状态码：
            #   200  项目在，且这个令牌对它有权限
            #   403  项目在，但不是这个令牌能碰的（ID 填成了别人的项目）
            #   404  没有这个项目
            # 拿它当"这个 ID 是不是我的"来用，比等第一次实发再看 404 早得多。
            #
            # 它本来是给 WoW 插件做本地化导出的，Minecraft 项目上多半返回空，
            # 那不要紧：我们要的就是那个状态码。
            CODE=$(curl -sS -o cf-project.txt -w '%{http_code}' \
                   -H "X-Api-Token: $CURSEFORGE_TOKEN" \
                   "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_ID/localization/export")
            case "$CODE" in
              200) echo "项目 $CURSEFORGE_ID 存在，且这个令牌对它有权限" ;;
              403) echo "::error::403 —— 项目 $CURSEFORGE_ID 不是这个令牌能碰的，检查 CURSEFORGE_ID 是不是填成了别人的项目"; exit 1 ;;
              404) echo "::error::404 —— 找不到项目 $CURSEFORGE_ID，CURSEFORGE_ID 填错了"; exit 1 ;;
              *)   echo "::error::验项目 ID 时拿到意外的状态码 $CODE"; head -c 300 cf-project.txt; exit 1 ;;
            esac
          fi
          # 这个接口本身就要令牌，取得到就说明令牌有效。
          curl -sS --fail-with-body -H "X-Api-Token: $CURSEFORGE_TOKEN" \
               https://minecraft.curseforge.com/api/game/versions -o versions.json || {
            echo "::error::CurseForge 令牌无效，或没有这个项目的权限"; exit 1; }
          echo "令牌有效，取到 $(python3 -c 'import json;print(len(json.load(open("versions.json"))))') 条版本记录"
          # release.yml 里两支分别声称的那几样，逐个确认对方表里有。
          # 对不上就是发版当场失败的那种错，宁可在这里先看见。
          python3 - <<'PY'
          import json, sys
          vs = json.load(open("versions.json"))
          names = {v["name"] for v in vs}
          want = ["1.21.1", "1.20.1", "NeoForge", "Forge", "Java 21", "Java 17"]
          missing = [w for w in want if w not in names]
          for w in want:
              print(f'  {"OK  " if w in names else "缺失"}  {w}')
          if missing:
              print(f'::error::CurseForge 版本表里没有：{", ".join(missing)}')
              sys.exit(1)
          PY
