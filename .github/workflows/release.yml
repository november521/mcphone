name: Release

# 只在推 v* tag 时触发。build.yml 触发于 push 分支，两者不重叠、不会重复跑。
on:
  push:
    tags:
      - 'v*'

# 默认的 GITHUB_TOKEN 是只读的，不显式提权就创建不了 Release。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 打了 v1.0.1 而 gradle.properties 还写着 1.0.0，是发版事故的常见来源：
      # jar 文件名、模组列表里的版本号会与 Release 标题对不上。宁可在这里失败。
      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "tag=$GITHUB_REF_NAME  mod_version=$MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 gradle.properties 的 mod_version=$MOD_VERSION 不一致，请先对齐再发版"
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew build

      # 声称支持 neo_version_range 的下限，就得证明代码没用上更新的 API，
      # 否则低版本玩家会在运行时撞上 NoSuchMethodError 而不是加载失败提示。
      - name: Verify minimum NeoForge version still compiles
        run: |
          MIN_NEO=$(grep -E '^neo_version_range=' gradle.properties \
            | sed -E 's/^neo_version_range=\[?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "declared minimum NeoForge: $MIN_NEO"
          ./gradlew compileJava -Pneo_version="$MIN_NEO"

      - name: Find built JAR
        id: find-jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::build/libs 下没找到可发布的 jar"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      # 正文取自仓库内与 tag 同名的说明文件，让 Release 描述也进版本控制；
      # 没有对应文件时退回 GitHub 依据提交记录自动生成，不至于发出一个空描述。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAR_PATH: ${{ steps.find-jar.outputs.jar_path }}
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "使用 $NOTES_FILE 作为 Release 正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" \
              --title "MCphone $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            echo "未找到 $NOTES_FILE，退回自动生成正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" \
              --title "MCphone $GITHUB_REF_NAME" \
              --generate-notes
          fi
