name: Release

# 版本号【只由这份 workflow 改】，任何人手动改 gradle.properties 的 mod_version
# 都会被 build.yml 里那道 guard-version 拦下。
#
# 为什么改成这样
#
# 原先是"人手改 mod_version、人手打 tag，这里再校验两者一致"。那套的问题不在于
# 校验不严，而在于【版本号在没发版的时候也会动】：每个 commit 随手 +1，攒出一串
# 谁也没见过的号，还会因为分支合并往回走——1.10.1 到 1.10.4 之间就出现过两个
# 内容不同、mod_version 都写 1.10.1 的 commit。而这个字段是要烧进 jar、在游戏内
# 模组列表里显示的。
#
# 现在：平时提交一律不碰它，发版时在 Actions 页面手动触发这份 workflow，选一个
# bump 类型，由 CI 算出新号、写进文件、构建、提交、打 tag、发布。仓库里那个值
# 因此永远等于"最近一次发出去的版本"。
#
# 怎么选 bump 类型：三档各指什么写在 gradle.properties 的 mod_version 上方。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '基准号怎么升。【当前带预发布后缀时这一项被忽略，基准号冻结】——要换基准号用 custom。promote ＝ 转正（等同于把发布渠道选成 release）'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - promote
          - custom
      custom_version:
        description: '自定义版本号（仅当上面选 custom 时填，形如 1.11.0）'
        required: false
        type: string
      release_type:
        description: '发布渠道。【它决定版本号后缀】：alpha → x.y.z-alpha.N，beta → x.y.z-beta.N，release → x.y.z。同渠道接着发序号 +1，换渠道从 1 起；beta 之后不许回 alpha（那是降级）'
        required: true
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha
      dry_run:
        description: '试跑：构建与校验照跑，但不提交、不打 tag、不发布'
        required: false
        type: boolean
        default: false

# 默认的 GITHUB_TOKEN 是只读的，不显式提权就推不了 commit、也建不了 Release。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 给下面的 publish job 用：它按目标矩阵各发各的
    outputs:
      matrix: ${{ steps.buildall.outputs.matrix }}
      version: ${{ steps.ver.outputs.new }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 【停在 v5，不要升 v6】。v6 把缓存那部分抽成了 gradle-actions-caching，
      # 那是个不再开源的商业组件，启用缓存就等于接受 Gradle 自己那份
      # Terms of Use（https://gradle.com/legal/terms-of-use/）。一个 MIT 的
      # 模组仓库不该在顺手修个告警的时候，把自己绑上另一份条款。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # ---------------- 版本号 ----------------
      - name: 算出新版本号
        id: ver
        env:
          BUMP: ${{ inputs.version }}
          CUSTOM: ${{ inputs.custom_version }}
          CHANNEL: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')

          # 【算法在 .github/next-version.sh 里，不在这儿】。那个脚本能在本机直接跑，
          # 所以它是可测的 —— 这一段原先是内联 shell，改一次要发一次版才知道对不对。
          #
          # 渠道进版本号：alpha → x.y.z-alpha.N、beta → x.y.z-beta.N、release → x.y.z。
          # 原先渠道只管 Release 的预发布标记，于是 patch + beta 算出来的是 1.10.1 ——
          # 与将来的正式版同号，那个号当场烧掉。
          NEW=$(bash .github/next-version.sh "$CURRENT" "$BUMP" "$CHANNEL" "$CUSTOM")

          # tag 撞名就停。原先那套是"同名 tag 已有 Release 就删掉重建"，因为
          # 重推 tag 是个明确的人为动作。现在版本号由 CI 生成，撞名只可能是
          # 上一次发版跑到一半失败了——那种情况下悄悄覆盖掉已经发出去的东西
          # 比失败更糟，所以在这儿停，让人先看清楚上次断在哪儿。
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "::error::tag v$NEW 已存在。多半是上一次发版中途失败，请先确认那次的状态再重来"
            exit 1
          fi

          echo "当前 $CURRENT  ->  新版本 $NEW（bump=$BUMP 渠道=$CHANNEL）"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: 写进 gradle.properties
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          # 只动 mod_version 那一行，别的属性一个字不碰
          sed -i -E "s/^mod_version=.*/mod_version=${NEW}/" gradle.properties
          grep -E '^mod_version=' gradle.properties

      # ---------------- 构建与校验 ----------------
      #
      # 遍历 versions/targets.json 里所有 buildable 的目标逐个构建，产物全进 dist/。
      # 【一次发版就是所有目标各出一个 jar】—— 这正是这个仓库不按版本分分支的理由：
      # 分支一多，老版本永远慢半拍，而"慢了"这件事要等有人去看才知道。
      - name: Setup JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: 逐个目标构建
        id: buildall
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          mkdir -p dist

          TARGETS=$(jq -r 'to_entries[] | select((.value | type) == "object" and .value.buildable == true) | .key' versions/targets.json)
          if [ -z "$TARGETS" ]; then
            echo "::error::versions/targets.json 里一个 buildable 的目标都没有，没东西可发。"
            exit 1
          fi

          for T in $TARGETS; do
            PROJ=$(jq -r --arg t "$T" '.[$t].project' versions/targets.json)
            JAVA=$(jq -r --arg t "$T" '.[$t].java'    versions/targets.json)
            eval "TARGET_JAVA_HOME=\${JAVA_HOME_${JAVA}_X64:-}"
            if [ -z "$TARGET_JAVA_HOME" ]; then
              echo "::error::目标 $T 要 Java $JAVA，这台机器上没装。把它加进上面的 java-version。"
              exit 1
            fi

            echo "::group::$T  （$PROJ，Java $JAVA）"
            ( cd "$PROJ" && chmod +x ./gradlew && JAVA_HOME="$TARGET_JAVA_HOME" ./gradlew build )

            # 声称支持某个加载器版本区间的下限，就得证明代码没用上更新的 API，否则
            # 低版本玩家会在运行时撞上 NoSuchMethodError 而不是一句加载失败提示。
            # 只有声明了区间下限的目标才做这一步 —— 别的加载器没有这个属性。
            MIN_NEO=$(grep -E '^neo_version_range=' "$PROJ/gradle.properties" 2>/dev/null \
              | sed -E 's/^neo_version_range=\[?([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)
            if [ -n "$MIN_NEO" ]; then
              echo "  下限重编：NeoForge $MIN_NEO"
              ( cd "$PROJ" && JAVA_HOME="$TARGET_JAVA_HOME" ./gradlew compileJava -Pneo_version="$MIN_NEO" )
            fi

            # 【按确切文件名取，不要 find | head -1】。挑错就是把一个旧版本挂上
            # Release，玩家会真的下载。mod_version 是这次构建的唯一真值。
            JAR="$PROJ/build/libs/mcphone-${NEW}.jar"
            if [ ! -f "$JAR" ]; then
              echo "::error::没找到 $JAR。$PROJ/build/libs 下现有："
              ls -la "$PROJ/build/libs" || true
              exit 1
            fi
            # 各目标的 jar 在自己工程里同名，收进 dist 必须带目标名，
            # 否则后一个静默覆盖前一个
            cp "$JAR" "dist/mcphone-${NEW}-${T}.jar"
            echo "::endgroup::"
          done

          echo "── 产物 ──"
          ls -lh dist/

          # 发到 Modrinth / CurseForge 的那两步是 YAML 的 with:，跑不了 shell，
          # 而每个目标的 loaders 与 game-versions 都不一样。所以把矩阵在这儿算好，
          # 交给下面那个 publish job 按目标各发各的。
          MATRIX=$(jq -c '[to_entries[] | select((.value | type) == "object" and .value.buildable == true)
                           | {target: .key, loader: (.value.loader | ascii_downcase),
                              minecraft: .value.minecraft, java: .value.java}]' versions/targets.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "矩阵：$MATRIX"

      # ---------------- 发版说明 ----------------
      #
      # 【一个小版本一份说明，不是一次发布一份】
      #
      # 文件名按【基准号】走：1.10.2-beta.1、1.10.2-beta.2、1.10.2 这三次发布共用
      # docs/release-notes/v1.10.2.md 同一份。预发布期间就往那一份里写，转正时它已经
      # 是完整的了。
      #
      # 原先按完整版本号命名，于是同一条线被切成三份：v1.10.2-beta.1.md、
      # v1.10.2-beta.2.md、v1.10.2.md，而最后那份是从新的 next.md 起的 ——
      # beta 阶段写进去的东西在正式版的说明里【全部丢掉】，前两份成了孤儿。
      #
      # 【next.md 只用一次】：切第一个预发布时它被改名成 v<基准号>.md，之后直接改那份。
      # 两个都在会停下来，因为不知道该用哪个 —— 那种情况多半是有人在 next.md 里
      # 又写了一遍已经写过的东西。
      #
      # 【正式版发出去之后那份就冻结了】，build.yml 的 guard-version 会拦住后续修改。
      - name: 准备发版说明
        id: notes
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          BASE="${NEW%%-*}"
          TARGET="docs/release-notes/v${BASE}.md"
          NEXT=docs/release-notes/next.md

          if [ -f "$TARGET" ] && [ -f "$NEXT" ]; then
            echo "::error::$TARGET 与 $NEXT 同时存在，不知道该用哪个。"
            echo "v${BASE} 这条线的说明已经在 $TARGET 里了（上一个预发布时建的），"
            echo "把 $NEXT 的内容并进去、删掉 $NEXT，再发一次。"
            exit 1
          fi

          if [ -f "$TARGET" ]; then
            echo "沿用 $TARGET（v${BASE} 这条线的说明，预发布与正式版共用一份）"
          elif [ -f "$NEXT" ]; then
            mkdir -p docs/release-notes
            git mv "$NEXT" "$TARGET"
            echo "next.md 改名为 $TARGET —— 之后 v${BASE} 的说明直接改这一份，别再新建 next.md"
          else
            echo "::warning::没有 $NEXT，也没有 $TARGET。GitHub Release 会退回自动生成的提交列表，而那个玩家读不懂"
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "file=$TARGET" >> "$GITHUB_OUTPUT"

      # ---------------- 提交、打 tag、推送 ----------------
      #
      # 提交人刻意是 github-actions[bot]：build.yml 的 guard-version 认的就是
      # 这个邮箱，别人手改 mod_version 会被它拦下。改这里的身份等于把那道闸拆了。
      - name: 提交版本号并打 tag
        if: ${{ inputs.dry_run != true }}
        env:
          NEW: ${{ steps.ver.outputs.new }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties docs/release-notes
          if git diff --cached --quiet; then
            echo "::error::没有任何改动可提交，版本号大概没写进去"
            exit 1
          fi
          git commit -m "release: v${NEW}"
          git tag "$TAG"
          git push
          git push origin "$TAG"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          # 标题不写死加载器：一个 Release 现在挂着所有目标的 jar
          TITLE="MCphone ${TAG}"
          # beta / alpha 一律标成预发布：GitHub 上那一版不会顶掉 Latest，
          # 玩家从仓库首页点下载拿到的仍然是上一个正式版
          PRERELEASE=""
          if [ "$RELEASE_TYPE" != "release" ]; then
            TITLE="$TITLE ($RELEASE_TYPE)"
            PRERELEASE="--prerelease"
          fi
          if [ -n "$NOTES_FILE" ]; then
            gh release create "$TAG" dist/*.jar --title "$TITLE" $PRERELEASE --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/*.jar --title "$TITLE" $PRERELEASE --generate-notes
          fi

      - name: 试跑：只报告，不发布
        if: ${{ inputs.dry_run == true }}
        env:
          NEW: ${{ steps.ver.outputs.new }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          echo "试跑：本来会发 v${NEW}，一个 Release 挂下面这些 jar"
          ls -lh dist/
          echo "  说明   ${NOTES_FILE:-（没有，会退回自动生成）}"
          echo "没有提交、没有打 tag、没有发布。"

      # 产物留一份给 publish job 取用
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcphone-jars
          path: dist/*.jar
          retention-days: 7

      - name: 汇总
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          echo "v${NEW} 的全部产物："
          ls -1 dist/

  # ============================================================
  #  发布到 Modrinth 与 CurseForge
  # ============================================================
  #
  # 【单独一个 job，按目标跑矩阵】。上面那个 job 已经把所有 jar 建好了，但发到这两个
  # 平台的动作是 YAML 的 uses:，跑不了 shell 循环，而每个目标的 loaders 与
  # game-versions 都不一样 —— 只能一个目标一次调用。矩阵由上面那步算出来。
  #
  # 用 Kira-NT/mc-publish。作者改过名，网上大量教程写的还是 Kir-Antipov/mc-publish
  # —— 那个地址目前靠 GitHub 的仓库重定向还能用，但重定向会在原名被别人注册时失效，
  # 所以这里写现在的名字。版本钉死在 v3.3.1 而不是 v3：v3 是会移动的 tag，
  # 作者一推新版，我们这边就在毫无改动的情况下换了行为。
  #
  # 【四个配置项都在 GitHub 网页上填，不改这个文件】：
  #   仓库 → Settings → Secrets and variables → Actions
  #     Variables 页：MODRINTH_ID、CURSEFORGE_ID     （项目 ID，公开信息）
  #     Secrets 页：  MODRINTH_TOKEN、CURSEFORGE_TOKEN（令牌，绝不能进仓库）
  publish:
    name: 发布 ${{ matrix.t.target }}
    needs: release
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    strategy:
      # 一个平台发失败不该连累另一个 —— 它们各发各的
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.release.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: 取回产物
        uses: actions/download-artifact@v7
        with:
          name: mcphone-jars
          path: dist

      - name: Check publishing credentials
        id: creds
        # 令牌只在这一步进环境，不挂到 job 级 env 上
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # 缺凭据就跳过那个平台并留一条 warning，不让整次发版判失败：
          # GitHub Release 此时已经建好了，为一个还没配的令牌把它标成红叉，
          # 只会让人误以为发出去的包有问题。
          if [ -n "$MODRINTH_ID" ] && [ -n "$MODRINTH_TOKEN" ]; then
            echo "modrinth=true" >> "$GITHUB_OUTPUT"
          else
            echo "modrinth=false" >> "$GITHUB_OUTPUT"
            echo "::warning::跳过 Modrinth：变量 MODRINTH_ID 或密钥 MODRINTH_TOKEN 没配"
          fi
          if [ -n "$CURSEFORGE_ID" ] && [ -n "$CURSEFORGE_TOKEN" ]; then
            echo "curseforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "curseforge=false" >> "$GITHUB_OUTPUT"
            echo "::warning::跳过 CurseForge：变量 CURSEFORGE_ID 或密钥 CURSEFORGE_TOKEN 没配"
          fi

      - name: 这个目标的 jar 与更新日志
        id: files
        env:
          NEW: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          T: ${{ matrix.t.target }}
        run: |
          set -euo pipefail
          JAR="dist/mcphone-${NEW}-${T}.jar"
          [ -f "$JAR" ] || { echo "::error::没找到 $JAR"; ls -la dist; exit 1; }
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

          # 这两个平台没有"自动生成更新日志"这回事：changelog 留空，版本页就真是
          # 一片空白。所以保证【总有一个文件】，最差也是一条指回 Release 的链接。
          # 按【基准号】找，与上面「准备发版说明」那一步同一个文件 ——
          # 1.10.2-beta.2 与 1.10.2 共用 v1.10.2.md
          FILE="docs/release-notes/v$(printf '%s' "${TAG#v}" | cut -d- -f1).md"
          if [ ! -f "$FILE" ]; then
            FILE="changelog.md"
            echo "完整更新内容见 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" > "$FILE"
          fi
          echo "changelog=$FILE" >> "$GITHUB_OUTPUT"

      # 两个平台【刻意分成两步】。mc-publish 只往"id 与 token 都齐了"的平台发，
      # 合成一步也能跑，但那样一个平台没配好、或者一个平台挂了，另一个就一起发不出去。
      - name: Publish to Modrinth
        if: steps.creds.outputs.modrinth == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # 【不传 github-token】：Release 上面已经建好并挂好全部 jar 了，
          # 再让它插一手就是重复上传。这个输入没有默认值，不写即不发。
          #
          # 【按确切文件名传，不用通配】——挑错就是把别的目标的包发到这个平台条目下，
          # 而那边不像 GitHub，删了重发会留下痕迹、玩家可能已经下过。
          files: ${{ steps.files.outputs.jar }}
          name: MCphone ${{ needs.release.outputs.tag }} (${{ matrix.t.target }})
          version: ${{ needs.release.outputs.version }}+${{ matrix.t.target }}
          version-type: ${{ inputs.release_type }}
          changelog-file: ${{ steps.files.outputs.changelog }}
          loaders: ${{ matrix.t.loader }}
          game-versions: ${{ matrix.t.minecraft }}
          java: ${{ matrix.t.java }}
          # 依赖【不写】，让它从 jar 里的模组元数据自己读。Modrinth 这边这么做是安全的：
          # 查不到的依赖它 catch 住再 filter 掉，不会连累上传。CurseForge 那边不能这样。

      - name: Publish to CurseForge
        if: steps.creds.outputs.curseforge == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.files.outputs.jar }}
          name: MCphone ${{ needs.release.outputs.tag }} (${{ matrix.t.target }})
          version: ${{ needs.release.outputs.version }}+${{ matrix.t.target }}
          version-type: ${{ inputs.release_type }}
          changelog-file: ${{ steps.files.outputs.changelog }}
          loaders: ${{ matrix.t.loader }}
          game-versions: ${{ matrix.t.minecraft }}
          java: ${{ matrix.t.java }}
          # 【刻意声明"没有依赖"】，空串就是这个意思（不写才是"从 jar 里读"）。
          #
          # 两个平台处理"不认识的依赖"的方式不一样：Modrinth 查不到就丢掉；
          # CurseForge 是把 modId 原样当 slug 提交上去，slug 在那边不存在就【整次上传
          # 失败】。而元数据里那几个可选依赖的 CurseForge slug 是否与 modId 同名，
          # 没有逐个核实过。为一条装饰性的依赖信息赌上整次发版不划算。
          dependencies: ''
