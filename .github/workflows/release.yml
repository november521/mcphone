name: Release

# 只在推 v* tag 时触发。build.yml 触发于 push 分支，两者不重叠、不会重复跑。
#
# 这一支（main = NeoForge 1.21.1）用不带前缀的 v<版本>，与分支化之前的十来个
# 老 tag 一脉相承。1.20.1-forge 分支那边用 forge-v<版本>——tag 在 git 里是
# 【仓库级】的、不属于任何分支，两支都用 v1.0.0 会撞名。
#
# 至于该跑哪份 workflow，不用自己分派：推 tag 时 GitHub 用的是【tag 所指向那个
# commit 里的】workflow 文件，tag 打在哪个分支上就跑那个分支的。
on:
  push:
    tags:
      - 'v*'

# 默认的 GITHUB_TOKEN 是只读的，不显式提权就创建不了 Release。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 【停在 v5，不要升 v6】。v6 把缓存那部分抽成了 gradle-actions-caching，
      # 那是个不再开源的商业组件，启用缓存就等于接受 Gradle 自己那份
      # Terms of Use（https://gradle.com/legal/terms-of-use/）。一个 MIT 的
      # 模组仓库不该在顺手修个告警的时候，把自己绑上另一份条款。
      #
      # v5 相对 v4 的唯一变更就是跑在 node 24 上 —— 而那正是我们要修的那条
      # 弃用告警。真需要 v6 里的东西时再单独权衡，别跟着"升到最新"一起做。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 打了 v1.0.1 而 gradle.properties 还写着 1.0.0，是发版事故的常见来源：
      # jar 文件名、模组列表里的版本号会与 Release 标题对不上。宁可在这里失败。
      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "tag=$GITHUB_REF_NAME  mod_version=$MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 gradle.properties 的 mod_version=$MOD_VERSION 不一致，请先对齐再发版"
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew build

      # 声称支持 neo_version_range 的下限，就得证明代码没用上更新的 API，
      # 否则低版本玩家会在运行时撞上 NoSuchMethodError 而不是加载失败提示。
      - name: Verify minimum NeoForge version still compiles
        run: |
          MIN_NEO=$(grep -E '^neo_version_range=' gradle.properties \
            | sed -E 's/^neo_version_range=\[?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "declared minimum NeoForge: $MIN_NEO"
          ./gradlew compileJava -Pneo_version="$MIN_NEO"

      - name: Find built JAR
        id: find-jar
        run: |
          # 【按确切文件名取，不要 find | head -1】，理由见 build.yml 里同名步骤。
          # 这里更要紧：挑错就是把一个旧版本挂上 Release，玩家会真的下载。
          #
          # mod_version 已经在上面与 tag 校验过一致，直接拿它拼名字。
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          JAR_PATH="build/libs/mcphone-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::没找到 $JAR_PATH。build/libs 下现有："
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          # 下面两个给发布到 Modrinth / CurseForge 的步骤用。
          # 那两步是 YAML 里的 with:，跑不了 shell，只能在这儿把值取出来。
          # minecraft_version 不会误匹配 minecraft_version_range —— 正则要求
          # 名字后面紧跟等号。
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          MC_VERSION=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"

      # 同名 tag 已有 Release 时先删掉，否则下面的 gh release create 会直接失败。
      # 语义是"重推 tag ＝ 重新出这个版本"：强推同名 tag 本身已是明确的破坏性
      # 动作，不会误触。只删与本次 tag 同名的那一个，不碰其他版本。
      - name: Remove pre-existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::$GITHUB_REF_NAME 已存在 Release，将删除后重建"
            gh release delete "$GITHUB_REF_NAME" --yes
          else
            echo "$GITHUB_REF_NAME 尚无 Release，直接创建"
          fi

      # 正文取自仓库内与 tag 同名的说明文件，让 Release 描述也进版本控制；
      # 没有对应文件时退回 GitHub 依据提交记录自动生成，不至于发出一个空描述。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAR_PATH: ${{ steps.find-jar.outputs.jar_path }}
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          TITLE="MCphone NeoForge 1.21.1 ${GITHUB_REF_NAME}"
          if [ -f "$NOTES_FILE" ]; then
            echo "使用 $NOTES_FILE 作为 Release 正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "未找到 $NOTES_FILE，退回自动生成正文"
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --generate-notes
          fi

      # ---------------- 发布到 Modrinth 与 CurseForge ----------------
      #
      # 用 Kira-NT/mc-publish。作者改过名，网上大量教程写的还是
      # Kir-Antipov/mc-publish —— 那个地址目前靠 GitHub 的仓库重定向还能用，
      # 但重定向会在原名被别人注册时失效，所以这里写现在的名字。
      # 版本钉死在 v3.3.1 而不是 v3：v3 是会移动的 tag，作者一推新版，
      # 我们这边就在毫无改动的情况下换了行为。
      #
      # 【四个配置项都在 GitHub 网页上填，不改这个文件】：
      #   仓库 → Settings → Secrets and variables → Actions
      #     Variables 页：MODRINTH_ID、CURSEFORGE_ID     （项目 ID，公开信息）
      #     Secrets 页：  MODRINTH_TOKEN、CURSEFORGE_TOKEN（令牌，绝不能进仓库）
      # 这些是【仓库级】的，不分分支：1.20.1-forge 那边不用再填一遍。
      - name: Check publishing credentials
        id: creds
        # 令牌只在这一步进环境，不挂到 job 级 env 上 —— 那样上面每一步
        # （包括 ./gradlew build 跑的一堆第三方插件）都能读到它。
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # 缺凭据就跳过那个平台并留一条 warning，不让整次发版判失败：
          # GitHub Release 此时已经建好了，为一个还没配的令牌把它标成红叉，
          # 只会让人误以为发出去的包有问题。warning 在 Actions 页面上是黄色
          # 的一行，不至于悄没声地跳过。
          if [ -n "$MODRINTH_ID" ] && [ -n "$MODRINTH_TOKEN" ]; then
            echo "modrinth=true" >> "$GITHUB_OUTPUT"
          else
            echo "modrinth=false" >> "$GITHUB_OUTPUT"
            echo "::warning::跳过 Modrinth：变量 MODRINTH_ID 或密钥 MODRINTH_TOKEN 没配"
          fi
          if [ -n "$CURSEFORGE_ID" ] && [ -n "$CURSEFORGE_TOKEN" ]; then
            echo "curseforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "curseforge=false" >> "$GITHUB_OUTPUT"
            echo "::warning::跳过 CurseForge：变量 CURSEFORGE_ID 或密钥 CURSEFORGE_TOKEN 没配"
          fi

      - name: Prepare changelog for mod sites
        id: changelog
        if: steps.creds.outputs.modrinth == 'true' || steps.creds.outputs.curseforge == 'true'
        run: |
          # 上面建 Release 时没有说明文件可以退回 --generate-notes，
          # 这两个平台没有那个东西：changelog 留空，版本页就真的是一片空白。
          # 所以这里保证【总有一个文件】，最差也是一条指回 Release 的链接。
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="build/publish-changelog.md"
            echo "完整更新内容见 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" > "$NOTES_FILE"
            echo "::warning::未找到 docs/release-notes/${GITHUB_REF_NAME}.md，两个平台的更新日志只会有一条 Release 链接"
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # 两个平台【刻意分成两步】。mc-publish 只往"id 与 token 都齐了"的平台发，
      # 合成一步也能跑，但那样一个平台没配好、或者一个平台挂了，另一个就一起
      # 发不出去。
      - name: Publish to Modrinth
        if: steps.creds.outputs.modrinth == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # 【不传 github-token】：Release 上面已经用 gh 建好并挂好 jar 了，
          # 再让它插一手就是重复上传。这个输入没有默认值，不写即不发。
          #
          # 【按确切文件名传，不用它默认的 build/libs/*.jar 通配】——
          # 理由与 find-jar 那步同一个：挑错就是把旧版本发到平台上，
          # 而那边不像 GitHub，删了重发会留下痕迹、玩家可能已经下过。
          files: ${{ steps.find-jar.outputs.jar_path }}
          name: MCphone NeoForge 1.21.1 ${{ github.ref_name }}
          version: ${{ steps.find-jar.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.changelog.outputs.file }}
          loaders: neoforge
          game-versions: ${{ steps.find-jar.outputs.mc_version }}
          java: 21
          # 依赖【不写】，让它从 jar 里的 neoforge.mods.toml 自己读
          # （curios、waystones 会作为可选依赖标上去）。Modrinth 这边这么做
          # 是安全的：查不到的依赖它 catch 住再 filter 掉，不会连累上传。
          # CurseForge 那边【不能】这样，理由见下面那一步。

      - name: Publish to CurseForge
        if: steps.creds.outputs.curseforge == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.find-jar.outputs.jar_path }}
          name: MCphone NeoForge 1.21.1 ${{ github.ref_name }}
          version: ${{ steps.find-jar.outputs.mod_version }}
          version-type: release
          changelog-file: ${{ steps.changelog.outputs.file }}
          loaders: neoforge
          game-versions: ${{ steps.find-jar.outputs.mc_version }}
          java: 21
          # 【刻意声明"没有依赖"】，空串就是这个意思（不写才是"从 jar 里读"）。
          #
          # 两个平台处理"不认识的依赖"的方式不一样：Modrinth 查不到就丢掉；
          # CurseForge 是把 modId 原样当 slug 提交上去，slug 在那边不存在
          # 就【整次上传失败】。而 mods.toml 里的 mcef、netmusic、balm 这几个
          # 的 CurseForge slug 是否与 modId 同名，没有逐个核实过。
          # 为一条装饰性的依赖信息赌上整次发版不划算。
          #
          # 等在 CurseForge 上逐个确认过 slug，再照 mc-publish 的语法
          # （id@version(type)，一行一条）填回来。
          dependencies: ''
