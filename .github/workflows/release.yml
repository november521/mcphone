name: Release

# 只在推 forge-v* tag 时触发。
#
# 为什么带前缀：tag 在 git 里是【仓库级】的，不属于任何分支，所以两个版本
# 分支要是都用 v1.0.0 就撞了。前缀让它一眼看得出是哪一支。
#
# 至于该跑哪份 workflow —— 不用自己分派：推 tag 时 GitHub 用的是【tag 所指向
# 那个 commit 里的】workflow 文件。tag 打在这个分支上，跑的自然就是这一份。
on:
  push:
    tags:
      - 'forge-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 打了 forge-v0.1.1 而 gradle.properties 还写着 0.1.0，是发版事故的常见来源：
      # jar 文件名、模组列表里的版本号会与 Release 标题对不上。宁可在这里失败。
      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#forge-v}"
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "tag=$GITHUB_REF_NAME  版本段=$TAG_VERSION  mod_version=$MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 gradle.properties 的 mod_version=$MOD_VERSION 不一致，请先对齐再发版"
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew build

      # 声称支持 forge_version_range 的下限，就得证明代码没用上更新的 API，
      # 否则低版本玩家会在运行时撞上 NoSuchMethodError 而不是加载失败提示。
      - name: Verify minimum Forge version still compiles
        run: |
          MIN_FORGE=$(grep -E '^forge_version_range=' gradle.properties \
            | sed -E 's/^forge_version_range=\[?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "declared minimum Forge: $MIN_FORGE"
          ./gradlew compileJava -Pforge_version="$MIN_FORGE"

      - name: Find built JAR
        id: find-jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-slim.jar" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::build/libs 下没找到可发布的 jar"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      # 同名 tag 已有 Release 时先删掉，否则 gh release create 会直接失败。
      # 语义是"重推 tag ＝ 重新出这个版本"。只删与本次 tag 同名的那一个。
      - name: Remove pre-existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::$GITHUB_REF_NAME 已存在 Release，将删除后重建"
            gh release delete "$GITHUB_REF_NAME" --yes
          else
            echo "$GITHUB_REF_NAME 尚无 Release，直接创建"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAR_PATH: ${{ steps.find-jar.outputs.jar_path }}
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          TITLE="MCphone Forge 1.20.1 v${GITHUB_REF_NAME#forge-v}"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" "$JAR_PATH" --title "$TITLE" --generate-notes
          fi
