name: Build & Upload

# 这个分支是 Forge 1.20.1 那一支。仓库里每个版本各占一个分支，
# 每个分支里就是一个普通的单工程仓库，根目录直接是 gradlew。
on:
  push:
    branches: [1.20.1-forge]
  pull_request:
    branches: [1.20.1-forge]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # 17，不是 21。Minecraft 1.20.1 跑在 Java 17 上，用 21 编出来的
      # class 文件版本低版本客户端加载不了，而报的错不会提到 Java 版本。
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # 【停在 v5，不要升 v6】。v6 把缓存那部分抽成了 gradle-actions-caching，
      # 那是个不再开源的商业组件，启用缓存就等于接受 Gradle 自己那份
      # Terms of Use（https://gradle.com/legal/terms-of-use/）。一个 MIT 的
      # 模组仓库不该在顺手修个告警的时候，把自己绑上另一份条款。
      #
      # v5 相对 v4 的唯一变更就是跑在 node 24 上 —— 而那正是我们要修的那条
      # 弃用告警。真需要 v6 里的东西时再单独权衡，别跟着"升到最新"一起做。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find built JAR
        id: find-jar
        run: |
          # 【按确切文件名取，不要 find | head -1】。
          #
          # build/libs 下不止一个 jar：jarJar 会额外出一个不含内嵌依赖的
          # -slim，而 pruneOldJars 还会留着前几个版本的。head -1 挑到谁看
          # 文件系统顺序 —— 挑错就发出一个旧版本、或者放 mp3 必崩的包，
          # 而构建全绿、测试全绿，没有任何东西会告诉你。
          #
          # mod_version 是这次构建的唯一真值，直接拿它拼名字。
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          JAR_PATH="build/libs/mcphone-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::没找到 $JAR_PATH。build/libs 下现有："
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.find-jar.outputs.jar_name }}
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30
