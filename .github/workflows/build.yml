name: Build & Upload

# 这个分支（main）是 NeoForge 1.21.1 那一支，也是当前的主力版本。
# 仓库里每个 Minecraft 版本 / 加载器各占一个分支，每个分支就是一个普通的
# 单工程仓库，根目录直接是 gradlew。1.20.1 的移植在 1.20.1-forge 分支上。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find built JAR
        id: find-jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::build/libs 下没找到可上传的 jar"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-jar.outputs.jar_name }}
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30
