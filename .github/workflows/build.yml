name: Build & Upload

# 这个分支是 Forge 1.20.1 那一支。仓库里每个版本各占一个分支，
# 每个分支里就是一个普通的单工程仓库，根目录直接是 gradlew。
on:
  push:
    branches: [1.20.1-forge]
  pull_request:
    branches: [1.20.1-forge]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 17，不是 21。Minecraft 1.20.1 跑在 Java 17 上，用 21 编出来的
      # class 文件版本低版本客户端加载不了，而报的错不会提到 Java 版本。
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find built JAR
        id: find-jar
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-slim.jar" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::build/libs 下没找到可上传的 jar"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-jar.outputs.jar_name }}
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30
