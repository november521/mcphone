name: Build & Upload

# 这个仓库【一个分支出多个版本】：支持哪些目标写在 versions/targets.json 里，
# 每个目标一个工程目录（platforms/<目标名>/），各有各的 Gradle 与 Java 版本。
#
# 这里遍历所有 buildable 的目标逐个构建 —— 不用 GitHub 的 matrix 分 job：
# 一次推送就该看到"哪个目标挂了"，分成几个 job 之后，红的是哪一个要点进去才知道，
# 而且 setup-java 一次就能把几个 JDK 都装好，分 job 反而更慢。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: 全部目标构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # 【一次把所有目标要的 JDK 都装上】。setup-java 会为每个版本导出
      # JAVA_HOME_<版本>_X64，下面按目标的 java 字段挑。
      #
      # ⚠ 这个列表要跟 versions/targets.json 里出现过的 java 值一致。多装一个不要紧，
      # 少装一个会在循环里报"JAVA_HOME_17_X64 为空"——所以下面那句挑 JDK 的代码
      # 取不到就直接失败，不退回默认 JDK：拿错 JDK 编出来的 class 文件版本不对，
      # 而那要等玩家装上才发现。
      - name: Setup JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      # 【停在 v5，不要升 v6】。v6 把缓存那部分抽成了 gradle-actions-caching，
      # 那是个不再开源的商业组件，启用缓存就等于接受 Gradle 自己那份
      # Terms of Use（https://gradle.com/legal/terms-of-use/）。一个 MIT 的
      # 模组仓库不该在顺手修个告警的时候，把自己绑上另一份条款。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 逐个目标构建
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "仓库版本号：$VERSION"
          mkdir -p dist

          # 【编哪些 ≠ 发哪些】
          #
          #   工程目录存在  → 编。代码进了仓库就该编得过，不编它等于仓库里躺着
          #                   一份没有任何地方验证的源码。
          #   buildable:true → 产物进 dist/，也就是进 Release。
          #
          # 原先两件事由 buildable 一个字段管，于是一个"工程已并入、还没建起来"的
          # 目标【任何地方都不编】—— 本地不编（它不是当前平台）、CI 也跳过。
          # 那正是这套结构要消掉的那种静默：某个目标没跟上应该当场可见。
          ALL=$(jq -r 'to_entries[] | select((.value | type) == "object") | .key' versions/targets.json)
          if [ -z "$ALL" ]; then
            echo "::error::versions/targets.json 里一个目标都没有。"
            echo "这不是'没有目标'，是那个文件坏了或者被改空了 —— 就这么放行的话这个 job 会永远绿。"
            exit 1
          fi
          TARGETS=""
          for T in $ALL; do
            PROJ=$(jq -r --arg t "$T" '.[$t].project' versions/targets.json)
            if [ -d "$PROJ" ]; then TARGETS="$TARGETS $T"; fi
          done
          if [ -z "$TARGETS" ]; then
            echo "::error::声明的目标里没有一个的工程目录存在。"
            exit 1
          fi
          echo "要编的目标：$TARGETS"

          for T in $TARGETS; do
            PROJ=$(jq -r --arg t "$T" '.[$t].project' versions/targets.json)
            JAVA=$(jq -r --arg t "$T" '.[$t].java'    versions/targets.json)

            # 取不到就失败，别退回默认 JDK
            eval "TARGET_JAVA_HOME=\${JAVA_HOME_${JAVA}_X64:-}"
            if [ -z "$TARGET_JAVA_HOME" ]; then
              echo "::error::目标 $T 要 Java $JAVA，但这台机器上没装（JAVA_HOME_${JAVA}_X64 为空）。"
              echo "把 $JAVA 加进上面 Setup JDKs 的 java-version 列表。"
              exit 1
            fi
            if [ ! -d "$PROJ" ]; then
              echo "::error::目标 $T 声明的工程目录 $PROJ 不存在。"
              exit 1
            fi

            echo "::group::$T  （$PROJ，Java $JAVA）"
            ( cd "$PROJ" && chmod +x ./gradlew && JAVA_HOME="$TARGET_JAVA_HOME" ./gradlew build )

            # 【按确切文件名取，不要 find | head -1】。挑错的后果是发出一个旧版本或
            # 残缺包，而构建全绿、测试全绿，没有任何东西会告诉你。
            # mod_version 是这次构建的唯一真值，直接拿它拼名字。
            JAR="$PROJ/build/libs/mcphone-${VERSION}.jar"
            if [ ! -f "$JAR" ] && [ "$(jq -r --arg t "$T" '.[$t].buildable' versions/targets.json)" = "true" ]; then
              echo "::error::没找到 $JAR。$PROJ/build/libs 下现有："
              ls -la "$PROJ/build/libs" || true
              exit 1
            fi
            # 【只有 buildable 的产物进 dist/】。编是为了知道它编不编得过，
            # 发是另一件事：还没建稳的目标不该混进 Release。
            BUILDABLE=$(jq -r --arg t "$T" '.[$t].buildable' versions/targets.json)
            if [ "$BUILDABLE" != "true" ]; then
              echo "编过了，但 buildable 还是 false —— 不进 dist/"
              echo "::endgroup::"
              continue
            fi
            # 各目标的 jar 在工程里同名（都是 mcphone-<版本>.jar），收进 dist 时
            # 必须带上目标名，否则后一个会把前一个覆盖掉，而且不报错
            cp "$JAR" "dist/mcphone-${VERSION}-${T}.jar"
            echo "::endgroup::"
          done

          echo "── 产物 ──"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcphone-jars
          path: dist/*.jar
          retention-days: 30

  # ============================================================
  #  版本号只能由 CI 改
  # ============================================================
  #
  # mod_version 归 release.yml 管：发版时它算出新号、写进【仓库根的】
  # gradle.properties、以 github-actions[bot] 的身份提交并打 tag。平时任何人都不该动它。
  #
  # 为什么要一道闸而不是只写在注释里
  #
  # 原先那套规矩就写在注释里，写得很细，照样没挡住：号被随手 +1，攒出一串谁也没见过
  # 的版本，还因为分支合并往回走过。而这个字段要烧进 jar、在游戏内模组列表里显示，
  # 现在还要求【所有目标共用同一个号】—— 两个不同的包自称同一个版本，比不升号糟。
  #
  # 判据是【提交人】不是【改了什么】：bot 改得，人改不得。所以 release.yml 里那两行
  # git config 是这道闸的一半，改掉那个身份等于把闸拆了。
  guard-version:
    name: 版本号只能由 CI 改
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查 mod_version 有没有被人手改
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BOT: 'github-actions[bot]@users.noreply.github.com'
        run: |
          set -uo pipefail

          # 这次推送 / 这个 PR 引入了哪些 commit
          if [ -n "${BASE:-}" ]; then
            RANGE="${BASE}..HEAD"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..HEAD"
          else
            # 新分支、强推、或者基准 commit 已经不在了：退回只查最新这一个。
            # 宁可少查也不要因为算不出范围就整个跳过——跳过是静默的
            echo "::notice::拿不到对比基准（新分支或强推），只检查最新这一个 commit"
            RANGE="HEAD~1..HEAD"
          fi
          echo "检查范围：$RANGE"

          OFFENDERS=""
          for SHA in $(git rev-list "$RANGE"); do
            git show "$SHA" -- gradle.properties | grep -qE '^[+-]mod_version=' || continue
            EMAIL=$(git show -s --format='%ae' "$SHA")
            [ "$EMAIL" = "$BOT" ] && continue
            OFFENDERS="${OFFENDERS}$(git show -s --format='  %h  %an <%ae>  %s' "$SHA")"$'\n'
          done

          if [ -n "$OFFENDERS" ]; then
            echo "::error::下面这些 commit 手动改了 mod_version："
            printf '%s' "$OFFENDERS"
            echo ""
            echo "mod_version 只能由 release.yml 改。要发版就去 Actions → Release 手动触发，"
            echo "选 patch / minor / major，CI 会自己算号、提交、打 tag。"
            echo "把那行改动撤掉再推即可（git revert 或者改回原值）。"
            exit 1
          fi
          echo "没有人手动改过 mod_version"

      # 仓库级身份只能有仓库根那一份。平台里再定义一遍，两边就能各自漂移，
      # 而"所有目标同一个版本号"正是这套结构存在的理由。
      #
      # 平台的 build.gradle 读不到仓库根会直接失败，但它【不会】拦住"平台自己也定义了
      # 一份"——那种情况下 ext 里两个值打架，谁赢看加载顺序。所以在这儿拦。
      - name: 检查平台有没有自己定义仓库级的键
        run: |
          set -uo pipefail
          BAD=""
          for f in platforms/*/gradle.properties; do
            [ -f "$f" ] || continue
            HIT=$(grep -nE '^(mod_id|mod_name|mod_license|mod_group_id|mod_version)=' "$f" || true)
            [ -n "$HIT" ] && BAD="${BAD}${f}:"$'\n'"${HIT}"$'\n'
          done
          if [ -n "$BAD" ]; then
            echo "::error::平台的 gradle.properties 里出现了仓库级的键，它们只能写在仓库根："
            printf '%s' "$BAD"
            exit 1
          fi
          echo "平台没有重复定义仓库级的键"

      # 【矩阵是规则，不是清单】。targets.json 的 _comment 里写着"每个 Minecraft
      # 版本都要有 Forge / NeoForge / Fabric 三条"，但那只是一段注释 —— 这个仓库
      # 已经证明过写在注释里的规矩挡不住事（版本号那套规矩写得比这细，照样没挡住）。
      #
      # 少一条的后果是安静的：没人会在加 1.22 的时候想起 Fabric，而"某个版本没跟上
      # 是当场可见的"正是同一分支这套结构存在的理由。看不见就等于回到了多分支。
      - name: 检查 targets.json
        run: |
          set -uo pipefail
          F=versions/targets.json
          jq -e . "$F" > /dev/null || { echo "::error::$F 不是合法 JSON"; exit 1; }

          # 【jq 自己失败也要红】。第一版这里是 X=$(jq ...)，jq 的表达式写错时它
          # 往 stderr 吐一行、返回空字符串，而下面判的是"空 = 没有违规" —— 闸就绿了。
          # 实测踩过：has(.) 那句在 jq 里报 "Cannot check whether object has a object
          # key"，四道检查里的一道整个失效，退出码还是 0。
          #
          # 【q 里不能写 exit】：它总是在 X=$(q ...) 里被调用，那是个子 shell，
          # exit 只退出那个子 shell，外面照跑不误 —— 实测过，改成 exit 之后闸仍然是绿的。
          # 只能 return 非零，再靠每个调用点后面那句 || exit 1 把它接住。
          q_layers() {
            local out rc
            out=$(jq -r "$1" "$L"); rc=$?
            if [ "$rc" != "0" ]; then
              echo "::error::读 layers.json 的 jq 跑挂了（退出码 $rc），这道检查没能跑起来：" >&2
              echo "$1" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          q() {
            local out rc
            out=$(jq -r "$1" "$F"); rc=$?
            if [ "$rc" != "0" ]; then
              echo "::error::jq 表达式跑挂了（退出码 $rc），这道检查没能跑起来：" >&2
              echo "$1" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          FAIL=0

          # 一、每个 Minecraft 版本必须三个加载器齐全
          MISSING=$(q '
            [to_entries[] | select((.value|type)=="object")]
            | group_by(.value.minecraft)[]
            | { mc: .[0].value.minecraft, loaders: (map(.value.loader) | sort) }
            | select(.loaders != ["Fabric","Forge","NeoForge"])
            | "  \(.mc)  现有：\(.loaders | join("、"))"
          ') || exit 1
          if [ -n "$MISSING" ]; then
            echo "::error::有 Minecraft 版本没把三个加载器写齐："
            printf '%s\n' "$MISSING"
            echo "缺的那个也要写进去，buildable: false，note 里说明卡在哪儿。"
            echo "在这里看得见，才叫'没跟上是当场可见的'。"
            FAIL=1
          fi

          # 二、必填字段
          BAD=$(q '
            to_entries[] | select((.value|type)=="object")
            | . as $e
            | ["minecraft","loader","java","gradle","project","buildable"]
            | map(select($e.value[.] == null))
            | select(length > 0)
            | "  \($e.key)  缺：\(join("、"))"
          ') || exit 1
          if [ -n "$BAD" ]; then
            echo "::error::有条目缺必填字段："
            printf '%s\n' "$BAD"
            FAIL=1
          fi

          # 三、建得起来的目标不许还挂着 unverified —— 建得起来，那些值就被构建验过了。
          # 反过来说，把 buildable 翻成 true 的那一刻就得把 unverified 清掉，
          # 而清掉之前你得真的去查一遍。这道闸就是逼那一下。
          STILL=$(q '
            to_entries[] | select((.value|type)=="object")
            | select(.value.buildable == true and (.value.unverified // [] | length) > 0)
            | "  \(.key)  还标着：\(.value.unverified | join("、"))"
          ') || exit 1
          if [ -n "$STILL" ]; then
            echo "::error::buildable: true 的目标里还留着 unverified："
            printf '%s\n' "$STILL"
            echo "建得起来就说明这些值是对的。把 unverified 去掉（先确认一遍值本身）。"
            FAIL=1
          fi

          # 四、unverified 里写的字段名得真的存在，否则这个标记就是摆设
          GHOST=$(q '
            to_entries[] | select((.value|type)=="object")
            | . as $e
            | ($e.value.unverified // [])
            | map(. as $f | select(($e.value | has($f)) | not))
            | select(length > 0)
            | "  \($e.key)  unverified 里有这个条目根本没有的字段：\(join("、"))"
          ') || exit 1
          if [ -n "$GHOST" ]; then
            echo "::error::unverified 指向了不存在的字段："
            printf '%s\n' "$GHOST"
            FAIL=1
          fi

          # 五、layers 是必填，且写的层在 layers.json 里都得有
          L=versions/layers.json
          jq -e . "$L" > /dev/null || { echo "::error::$L 不是合法 JSON"; exit 1; }

          NOLAYERS=$(q '
            to_entries[] | select((.value|type)=="object")
            | select(.value.layers == null)
            | "  \(.key)"
          ') || exit 1
          if [ -n "$NOLAYERS" ]; then
            echo "::error::这些目标没写 layers 字段（挂零层也要写成 []）："
            printf '%s\n' "$NOLAYERS"
            echo "不写和写空数组是两回事：前者是漏了，后者是'确实一层都不挂'。"
            FAIL=1
          fi

          GHOSTL=$(jq -r --slurpfile L "$L" '
            to_entries[] | select((.value|type)=="object")
            | . as $e
            | ($e.value.layers // [])
            | map(select(. as $n | ($L[0] | has($n)) | not))
            | select(length > 0)
            | "  \($e.key)  挂了不存在的层：\(join("、"))"
          ' "$F"); RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::对照 layers.json 的 jq 跑挂了（退出码 $RC），这道检查没能跑起来"
            exit 1
          fi
          if [ -n "$GHOSTL" ]; then
            echo "::error::有目标挂了 versions/layers.json 里没有的层："
            printf '%s\n' "$GHOSTL"
            FAIL=1
          fi

          # 六、【目标的 Minecraft 版本必须够到层的 since】
          #
          # 这条是本地构建查不到的那一半：buildable: false 的目标根本不会被建，
          # 给 1.20.1-forge 挂上 1.20.5+ 在前面五道检查里完全合法（层存在、目录也在），
          # 编译器也不说话 —— 错要等那个目标真开始建的那天才炸。
          #
          # 【版本比较必须与 Groovy 那一份同语义：补零，不是比数组长度】
          #
          # jq 原生比数组是逐元素比、再比长度，于是 [1,21] < [1,21,0] 成立 ——
          # 而 gradle/mcphone-layers.gradle 里的 McphoneVersions.cmp 是补零比的，
          # 1.21 与 1.21.0 相等。差这一格的后果形态很坏：本地绿、CI 红，
          # 而 CI 的报错说的是"把这一层从 layers 里去掉"，指向的不是真原因。
          #
          # 跨语言合不成一份，只能同语义 + 留对拍用例。实测七组，补零后全对齐：
          #   1.21   vs 1.21.0  → 放行   （原生会拦，这是唯一分叉的一格）
          #   1.21.0 vs 1.21    → 放行
          #   1.21.1 vs 1.20.5  → 放行
          #   1.20.1 vs 1.20.5  → 拦下
          #   1.21   vs 1.21    → 放行
          #   1.20.5 vs 1.20.5  → 放行
          #   1.21   vs 1.20.5  → 放行
          TOOOLD=$(jq -r --slurpfile L "$L" '
            def ver: split(".") | map(tonumber);
            def vcmp($x; $y):
              ([($x|length), ($y|length)] | max) as $n
              | [range($n) | (($x[.] // 0) - ($y[.] // 0))]
              | map(select(. != 0)) | (.[0] // 0);
            to_entries[] | select((.value|type)=="object")
            | . as $e
            | ($e.value.layers // [])
            | map(. as $n
                  | $L[0][$n] as $spec
                  | select($spec != null and $spec.since != null
                           and (vcmp(($e.value.minecraft | ver); ($spec.since | ver)) < 0))
                  | "\($n)（自 \($spec.since) 起）")
            | select(length > 0)
            | "  \($e.key)  是 \($e.value.minecraft)，却挂了：\(join("、"))"
          ' "$F"); RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::比对 since 的 jq 跑挂了（退出码 $RC），这道检查没能跑起来"
            exit 1
          fi
          if [ -n "$TOOOLD" ]; then
            echo "::error::有目标挂了它的 Minecraft 版本还没有的层："
            printf '%s\n' "$TOOOLD"
            echo "层里装的东西在那个版本上不存在。把这一层从该目标的 layers 里去掉，"
            echo "或者确认 layers.json 里的 since 写对了。"
            FAIL=1
          fi

          # 六点五、【每一层必须二选一写 since 或 loader；加载器层要挂对】
          #
          # 写 since 的是版本层（同版本、三个加载器共用），写 loader 的是加载器层
          # （同加载器、各版本共用）。两个都没有，构建就不知道该禁哪个轴 ——
          # 而"不知道禁哪个轴"的层等于一道不设防的门。
          BADKIND=$(jq -r '
            to_entries[] | select((.value|type)=="object")
            | select((.value.since == null) == (.value.loader == null))
            | "  \(.key)  since=\(.value.since // "无")  loader=\(.value.loader // "无")"
          ' "$L"); RC=$?
          [ "$RC" = "0" ] || { echo "::error::查层类型的 jq 跑挂了（退出码 $RC）"; exit 1; }
          if [ -n "$BADKIND" ]; then
            echo "::error::这些层没有二选一写 since 或 loader："
            printf '%s\n' "$BADKIND"
            echo "写 since 是版本层，写 loader 是加载器层。都不写就不知道该禁哪个轴，都写是两件事挤在一层。"
            FAIL=1
          fi

          # 两种层分开放：dir 要落在与层的种类相符的那一支下
          WRONGSUB=$(jq -r '
            to_entries[] | select((.value|type)=="object")
            | select(.value.since != null or .value.loader != null)
            | . as $e
            | (if $e.value.since != null then "layers/version/" else "layers/loader/" end) as $want
            | select(($e.value.dir | startswith($want)) | not)
            | "  \($e.key)  是\(if $e.value.since != null then "版本层" else "加载器层" end)，dir 应在 \($want) 下，实际是 \($e.value.dir)"
          ' "$L"); RC=$?
          [ "$RC" = "0" ] || { echo "::error::查层目录的 jq 跑挂了（退出码 $RC）"; exit 1; }
          if [ -n "$WRONGSUB" ]; then
            echo "::error::有层的目录放错了支："
            printf '%s\n' "$WRONGSUB"
            echo "版本层放 layers/version/，加载器层放 layers/loader/ —— 两种层禁的轴正好相反，混在一起看不出来。"
            FAIL=1
          fi

          WRONGLOADER=$(jq -r --slurpfile L "$L" '
            to_entries[] | select((.value|type)=="object")
            | . as $e
            | ($e.value.layers // [])
            | map(. as $n | $L[0][$n] as $spec
                  | select($spec != null and $spec.loader != null and $spec.loader != $e.value.loader)
                  | "\($n)（\($spec.loader) 的）")
            | select(length > 0)
            | "  \($e.key)  是 \($e.value.loader)，却挂了：\(join("、"))"
          ' "$F"); RC=$?
          [ "$RC" = "0" ] || { echo "::error::比对加载器层的 jq 跑挂了（退出码 $RC）"; exit 1; }
          if [ -n "$WRONGLOADER" ]; then
            echo "::error::有目标挂了别的加载器的层："
            printf '%s\n' "$WRONGLOADER"
            FAIL=1
          fi

          # 七、【声明了却没有任何目标挂的层 = 孤儿层】
          #
          # 层里的文件只有被某个目标挂上才会进构建。没人挂的层是一整个目录的死代码，
          # 而且完全静默：构建绿、测试绿、jar 里少了那批文件也没有任何东西会说话。
          # 实测踩过：改 targets.json 时用旧备份覆盖回去，1.21+ 那一层的 5 个数据包
          # 文件当场全部退出构建，六道闸没有一道响。
          ORPHAN=$(jq -r --slurpfile T "$F" '
            . as $layers
            | [$T[0] | to_entries[] | select((.value|type)=="object") | (.value.layers // [])[]]
            | . as $used
            | $layers | to_entries[] | select((.value|type)=="object")
            | select(.key as $k | ($used | index($k)) == null)
            | "  \(.key)  （目录 \(.value.dir)）"
          ' "$L"); RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error::查孤儿层的 jq 跑挂了（退出码 $RC），这道检查没能跑起来"
            exit 1
          fi
          if [ -n "$ORPHAN" ]; then
            echo "::error::这些层在 layers.json 里声明了，但没有任何目标挂它："
            printf '%s\n' "$ORPHAN"
            echo "层里的文件只有被挂上才进构建。没人挂 = 整个目录是死代码，而且不报错。"
            echo "给该挂的目标补上 layers，或者把这一层从 layers.json 里删掉。"
            FAIL=1
          fi

          # 八、【层的目录在不在，由 populated 说了算】
          #
          # 这一条跟 gradle/mcphone-layers.gradle 里那一条是同一个模型，两边必须一致：
          #
          #   populated: true   java 与 resources 至少要有一个在，都不在就是内容丢了
          #                     或者 dir 写错
          #   populated: false  两个都不在是【正常的】—— git 不跟踪空目录，一个还没
          #                     开始填的层在克隆下来的仓库里本来就没有这些目录；
          #                     反过来，声明了没内容却有内容，是声明过期
          #
          # 这道检查跑在 CI 的干净检出上，正好是本地永远复现不出来的那个环境：
          # 本地那些目录是 mkdir 出来的，一直都在。
          LAYERROWS=$(q_layers '
            to_entries[] | select((.value|type)=="object")
            | "\(.key)\t\(.value.dir)\t\(.value.populated)"
          ') || exit 1
          while IFS=$'\t' read -r NAME DIR POP; do
            [ -n "$NAME" ] || continue
            HAS=0
            [ -d "$DIR/src/main/java" ] && HAS=1
            [ -d "$DIR/src/main/resources" ] && HAS=1
            if [ "$POP" = "true" ] && [ "$HAS" = "0" ]; then
              echo "::error::共享层 $NAME 声明了 populated: true，但 $DIR 下 src/main/java 与 src/main/resources 都不存在（在这次干净检出里）。"
              echo "要么内容丢了，要么 layers.json 里的 dir 写错了。这一层确实还没开始填的话，把 populated 改成 false。"
              FAIL=1
            fi
            if [ "$POP" = "false" ] && [ "$HAS" = "1" ]; then
              COUNT=$(find "$DIR/src/main" -type f 2>/dev/null | wc -l | tr -d " ")
              if [ "$COUNT" != "0" ]; then
                echo "::error::共享层 $NAME 声明了 populated: false，却有 $COUNT 个文件。声明过期了，把 populated 改成 true。"
                FAIL=1
              fi
            fi
          done <<< "$LAYERROWS"

          # 九、【数据包目录名 —— 覆盖所有目标，不只是建得起来的那个】
          #
          # Gradle 里那道只跑在 buildable: true 的目标上。而一个新目标的自然顺序是
          # 「先把工程放进来 → 编通 → 再翻 buildable: true」，那段时间正是有人在手工
          # 搬数据包文件、最容易把单复数搬错的时候，恰好一个看着的都没有。
          # 这跟 since 曾经的缺口是同一个形状，一并补上。
          #
          # 【改名表不在这儿，读 versions/datapack-renames.json】——Gradle 侧读的是
          # 同一份。同一条规则两个语言各写一份是这个仓库付过三次账的坑。
          R=versions/datapack-renames.json
          jq -e . "$R" > /dev/null || { echo "::error::$R 不是合法 JSON"; exit 1; }
          RCOUNT=$(jq -r '.renames | length' "$R") || exit 1
          if [ "${RCOUNT:-0}" = "0" ]; then
            echo "::error::$R 里的改名表是空的。空清单的闸永远是绿的，而它挡的正是静默失效。"
            exit 1
          fi
          RSINCE=$(jq -r '.since' "$R") || exit 1

          DPROWS=$(q '
            to_entries[] | select((.value|type)=="object")
            | "\(.key)\t\(.value.project)\t\(.value.minecraft)"
          ') || exit 1
          while IFS=$'\t' read -r NAME PROJ MC; do
            [ -n "$NAME" ] || continue
            RES="$PROJ/src/main/resources"
            [ -d "$RES" ] || continue          # 工程还没并进来，没东西可查
            SINGULAR=$(jq -rn --arg a "$MC" --arg b "$RSINCE" '
              def ver: split(".") | map(tonumber);
              def vcmp($x; $y):
                ([($x|length), ($y|length)] | max) as $n
                | [range($n) | (($x[.] // 0) - ($y[.] // 0))]
                | map(select(. != 0)) | (.[0] // 0);
              vcmp(($a|ver); ($b|ver)) >= 0') || exit 1
            while IFS=$'\t' read -r PLURAL SINGULARNAME; do
              [ -n "$PLURAL" ] || continue
              if [ "$SINGULAR" = "true" ]; then BAD_DIR="$PLURAL"; WANT="$SINGULARNAME";
              else BAD_DIR="$SINGULARNAME"; WANT="$PLURAL"; fi
              HITS=$(find "$RES" -path "$RES/data/*/$BAD_DIR/*" -type f 2>/dev/null || true)
              if [ -n "$HITS" ]; then
                echo "::error::目标 $NAME（Minecraft $MC）的数据包目录名不对：$BAD_DIR/ 应为 $WANT/"
                printf '%s\n' "$HITS" | sed 's/^/    /'
                echo "1.21（格式 48）把这些目录从复数改成了单数。放错不会报错，那条配方 / 进度只是静默地不存在。"
                FAIL=1
              fi
            done < <(jq -r '.renames | to_entries[] | "\(.key)\t\(.value)"' "$R")
          done <<< "$DPROWS"

          [ "$FAIL" = "0" ] || exit 1
          N=$(q '[to_entries[] | select((.value|type)=="object")] | length') || exit 1
          echo "targets.json 校验通过：$N 个目标，矩阵齐全"
