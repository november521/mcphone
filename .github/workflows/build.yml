name: Build & Upload

# 这个分支（main）是 NeoForge 1.21.1 那一支，也是当前的主力版本。
# 仓库里每个 Minecraft 版本 / 加载器各占一个分支，每个分支就是一个普通的
# 单工程仓库，根目录直接是 gradlew。1.20.1 的移植在 1.20.1-forge 分支上。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # 【停在 v5，不要升 v6】。v6 把缓存那部分抽成了 gradle-actions-caching，
      # 那是个不再开源的商业组件，启用缓存就等于接受 Gradle 自己那份
      # Terms of Use（https://gradle.com/legal/terms-of-use/）。一个 MIT 的
      # 模组仓库不该在顺手修个告警的时候，把自己绑上另一份条款。
      #
      # v5 相对 v4 的唯一变更就是跑在 node 24 上 —— 而那正是我们要修的那条
      # 弃用告警。真需要 v6 里的东西时再单独权衡，别跟着"升到最新"一起做。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find built JAR
        id: find-jar
        run: |
          # 【按确切文件名取，不要 find | head -1】。
          #
          # 眼下 CI 是全新检出、build/libs 里只有一个 jar，head -1 挑不错。
          # 但那是"碰巧"，不是"保证"：本地 pruneOldJars 会留着前两个版本，
          # 而 1.20.1-forge 那一支就因为 jarJar 多出一个 -slim 差点发错包 ——
          # 挑错的后果是发出一个旧版本或残缺包，而构建全绿、测试全绿，
          # 没有任何东西会告诉你。
          #
          # mod_version 是这次构建的唯一真值，直接拿它拼名字。
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')
          JAR_PATH="build/libs/mcphone-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::没找到 $JAR_PATH。build/libs 下现有："
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.find-jar.outputs.jar_name }}
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30
