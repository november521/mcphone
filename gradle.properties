# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## Minecraft / Forge
#
# 这一支盯的是 1.20.1，跑在 Java 17 上。别照着 NeoForge 那一支的数字改这里：
# 那边是 1.21.1 + Java 21，两边从加载器到 JDK 都不是一回事。
minecraft_version=1.20.1

# 【编译】用的 Forge 版本，不等于运行时要求的版本，后者见 forge_version_range。
forge_version=47.4.23

# 运行时接受的 Forge 版本范围，写进 mods.toml 的 versionRange。
# 与 NeoForge 那一支同一个道理：刻意与 forge_version 解耦，升级开发环境不该
# 把低版本玩家挡在门外。下限每次调整都必须用 -Pforge_version=<下限> 重编一遍
# 来验证没用上新 API。
forge_version_range=[47.4.0,)

# 加载器版本范围只能用主版本号做边界。1.20.1 的 FML 是 47。
loader_version_range=[47,)

## Mod
mod_id=mcphone
mod_name=MCphone
mod_license=MIT
mod_group_id=com.november.mcphone
mod_authors=november521

# 这里【不】放 mod_description。
#
# Gradle 读 gradle.properties 走的是 java.util.Properties，而那个规范定死了用
# ISO-8859-1 解码。中文写在这里，取出来就已经是 "æä¸é¨..." 了 —— 在它进
# processResources 之前就坏了，所以给 expand 设 filteringCharset 也救不回来
# （那一行仍然该设，它治的是另一种情况）。
#
# 描述直接写在 mods.toml 里。NeoForge 那一支也是这么做的，它把描述写在
# templates/META-INF/neoforge.mods.toml 里，所以从没撞上这个坑。

# 发版 tag 必须写成 forge-v<mod_version>，release.yml 会校验。
#
# 从 0.1.0 起：这一支是从 NeoForge 1.21.1 那边移植过来的，功能还没补齐，
# 用 1.8.x 会让人以为它和那边一样完整。补齐了再对齐版本号。
mod_version=0.1.0

## 可选联动依赖
#
# 版本号是 Modrinth 上的 version_number 字段，不是 Maven 语义版本。
# 与 NeoForge 那一支各写各的：1.20.1 与 1.21.1 的构件本来就不通用。
curios_version=5.14.1+1.20.1
netmusic_version=1.5.1-forge+mc1.20.1
# Patchouli 的接触面里有三样是它的【内部】类（BookRegistry、Book 的字段），
# 所以刻意挑 1.20.1 上【最老】的那个版本编译：对着最老的编，等于要求我们
# 只用那时就有的东西，往后的版本自然也有。挑最新的则相反。
patchouli_version=1.20.1-80-forge

# MP3 解码。这是【必需】依赖，不是可选联动：玩家往音乐目录里丢一个 mp3，
# 不该要求他再去装别的模组。走 jarJar 嵌进 jar，理由见 build.gradle。
javamp3_version=1.0.1
