# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## Minecraft / Forge
#
# 这一支盯的是 1.20.1，跑在 Java 17 上。别照着 NeoForge 那一支的数字改这里：
# 那边是 1.21.1 + Java 21，两边从加载器到 JDK 都不是一回事。
minecraft_version=1.20.1

# 【编译】用的 Forge 版本，不等于运行时要求的版本，后者见 forge_version_range。
forge_version=47.4.23

# 运行时接受的 Forge 版本范围，写进 mods.toml 的 versionRange。
# 与 NeoForge 那一支同一个道理：刻意与 forge_version 解耦，升级开发环境不该
# 把低版本玩家挡在门外。下限每次调整都必须用 -Pforge_version=<下限> 重编一遍
# 来验证没用上新 API。
forge_version_range=[47.4.0,)

# 加载器版本范围只能用主版本号做边界。1.20.1 的 FML 是 47。
loader_version_range=[47,)

## Mod
mod_id=mcphone
mod_name=MCphone
mod_license=MIT
mod_group_id=com.november.mcphone
mod_authors=november521

# 这里【不】放 mod_description。
#
# Gradle 读 gradle.properties 走的是 java.util.Properties，而那个规范定死了用
# ISO-8859-1 解码。中文写在这里，取出来就已经是 "æä¸é¨..." 了 —— 在它进
# processResources 之前就坏了，所以给 expand 设 filteringCharset 也救不回来
# （那一行仍然该设，它治的是另一种情况）。
#
# 描述直接写在 mods.toml 里。NeoForge 那一支也是这么做的，它把描述写在
# templates/META-INF/neoforge.mods.toml 里，所以从没撞上这个坑。

# 发版 tag 必须写成 forge-v<mod_version>，release.yml 会校验。
#
# 版本号【刻意不与 NeoForge 1.21.1 那一支对齐】。
#
# 0.1.0   骨架期：能编过、能拿到手机物品，别的都没有
# 0.9.0   基本功能全部移植完（开机、主屏、聊天、记事本、音乐、相册、相机、
#         应用商店、末影箱、设置），但联动还缺三个
# 0.10.0  ← 现在。联动补齐（Waystones + Balm、MCEF、FTB Quests 三条接上，
#         GuideME 核实为本来就通），dist 隔离与 SPI 两道构建期校验补上。
#         【还差一样】：界面与实际收发没有进游戏逐个验过 ——
#         1.0.0 就留给这一条了结之后。
#
# 【别直接写 1.8.x 去追那一支】。玩家看版本号判断的是"这一支有多完整"，
# 两支功能不等价的时候用同一个号，等于骗人。
#
# 三档各指什么，与那一支【同一套规矩】（原文在 main 的 gradle.properties 里，
# 这里照搬一份 —— 之前这一支没写，结果就是没人照着它升号）：
#
#   大版本  破坏别人已经在用的契约，只有三样算：IPhoneApp 等 SPI 接口去掉或
#           改签名、换肤贴图路径作废、存档状态文件不再兼容。
#   次版本  【一整套完备的功能】做完才升，补丁号归零。「联动从缺三个到齐全」
#           算一套；里头任何单独一步都不算。
#   补丁号  其余一切：一个新功能点、修 bug、调布局、改美术、重构、构建脚本、
#           接口加一个带默认实现的方法。
#
# 【每出一个新 jar 就要动号】。同名不同内容的 jar 是这套编号唯一要防的事 ——
# 玩家手上那个 mcphone-0.10.0.jar 与 build/libs 里那个 mcphone-0.10.0.jar
# 不是同一个文件时，表现出来是"改的东西没生效"，而没有任何东西会提示他。
#
# 只动 .gitignore、README、docs/ 这类【不进 jar】的文件不升号。注意
# 「只动注释」不等于不进 jar：改一句类注释会让它下面所有代码的行号平移，
# LineNumberTable 跟着变，class 的字节就变了（实测过）。行为一样，文件不一样。
#
# 发版 tag 必须写成 forge-v<mod_version>，release.yml 会校验。
mod_version=0.10.2

## 可选联动依赖
#
# 版本号是 Modrinth 上的 version_number 字段，不是 Maven 语义版本。
# 与 NeoForge 那一支各写各的：1.20.1 与 1.21.1 的构件本来就不通用。
curios_version=5.14.1+1.20.1
netmusic_version=1.5.1-forge+mc1.20.1
# Patchouli 的接触面里有三样是它的【内部】类（BookRegistry、Book 的字段），
# 所以刻意挑 1.20.1 上【最老】的那个版本编译：对着最老的编，等于要求我们
# 只用那时就有的东西，往后的版本自然也有。挑最新的则相反。
patchouli_version=1.20.1-80-forge

# Waystones（传送石碑，可选联动）。传送石 App 要用它的选点菜单。
# 编译对着 14.0.0 —— 这是【最老】的 1.20.1 可用版本（2023-06）。可选联动挑版本
# 的方向和别处相反：往新编译、往旧运行会 NoSuchMethodError，反过来则几乎不会
# 出事。用到的 createWaystoneSelection、WarpMode、WaystoneTeleportEvent.Pre、
# IWaystoneTeleportContext.setWarpItem 从 14.0.0 到 14.1.20 签名一字未变。
#
# 【与 NeoForge 那一支不是同一套 API】，别照抄那边的调用，见 WaystonesCompat。
waystones_version=14.0.0+forge-1.20

# Balm —— Waystones 的前置库，开菜单与挂事件走的都是它。
# 单独列出来是因为它是【独立模组】：Waystones 的 jar 里没有 Balm 的类，
# 只写 waystones 一个依赖，编译期就找不到 Balm.getNetworking()。
# 同样取下限编译，理由同上。
balm_version=7.0.1+forge-1.20

# MCEF（Minecraft Chromium Embedded Framework，可选联动）。浏览器 App 要用它。
# 它把 Chromium 渲染成一张 GL 纹理交给我们，其余全是我们自己的事。
# 首次使用会下载对应平台的 java-cef 原生库（约 200 MB），由它自己带界面处理。
#
# 2.1.6-1.20.1 是【唯一】标了 forge 加载器的 1.20.1 版本，2.1.4 及更早那几个
# 三端通吃的也在，但没有再往下挑的余地了 —— 与 Waystones 那条"取下限编译"的
# 规矩不冲突，这里本来就只有一个。它自带 org.cef.*（jcef 的 API 类），
# 所以不必再单独声明 jcef 依赖。
#
# 注意：它是【客户端】库。所有引用都关在 feature/browser/client 下，服务端一个
# 字节都不会碰到。
mcef_version=2.1.6-1.20.1

# MP3 解码。这是【必需】依赖，不是可选联动：玩家往音乐目录里丢一个 mp3，
# 不该要求他再去装别的模组。走 jarJar 嵌进 jar，理由见 build.gradle。
javamp3_version=1.0.1
