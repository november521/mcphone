# 仓库级的身份 —— 所有平台共用这一份，各平台【不许】自己再定义一遍。
#
# 为什么提到这里
#
# 这个仓库一次发版要出好几个 Minecraft 版本 / 加载器的 jar，而它们必须是【同一个
# 版本号】：玩家在两个版本上装到的 v1.11.0 得是同一次改动。版本号留在各平台的
# gradle.properties 里，它们就能各自漂移 —— 而"老版本悄悄落后"正是这套目录结构
# 要治的病。
#
# 各平台的 build.gradle 显式读这个文件（见 loadRepoProperties），读不到就构建失败。
#
# ⚠ mod_version 由 .github/workflows/release.yml 改，手改会被 build.yml 的
#   guard-version 拦下。怎么发版见下面。
mod_id=mcphone
mod_name=MCphone
mod_license=MIT
mod_group_id=com.november.mcphone
mod_version=1.10.1
