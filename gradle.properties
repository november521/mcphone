# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Loom 1.16 已支持 configuration-cache；若某个任务报 cache 相关错误就关掉这里
org.gradle.configuration-cache=true

# Fabric / Loom 版本
minecraft_version=1.21.1
loader_version=0.19.5
fabric_version=0.116.17+1.21.1
loom_version=1.15.3

# 用官方 Mojang 映射而不是 Yarn：mcphone 源码是 NeoForge（Mojang 映射）写的，
# 换 Yarn 会让每一个类名/方法名都变，等于整棵树重写。用 officialMojangMappings
# 则与上游源码逐字一致，只有加载器粘合层需要动。
# Loom 会在 remapJar 时自动把 Mojang 名映射到运行时用的 intermediary，无需操心。

# JavaMP3 —— 必需依赖，MP3 解码。Fabric 侧用 include 嵌进 jar（对应 NeoForge 的 jarJar）
javamp3_version=1.0.1

## Mod Properties
mod_id=mcphone
mod_name=MCphone
mod_license=MIT
# Fabric 移植版：主版本号跟着上游语义，后缀 -fabric 区分加载器。
# 首版定为 1.9.2-fabric.1；1.10.1-beta.1-fabric.1 起与上游 1.10.1 同步
# 上游 NeoForge 主线已到 1.10.1-beta.1（终端 App + 副手 HUD + 3D 模型），本版跟上
mod_version=1.10.1-beta.1-fabric.2
mod_group_id=com.november.mcphone

# === 1.10.1 同步新增：「终端」App 三家存储模组的编译依赖 ===
# AE2 与 ae2wtlib 在 1.21.1 上只有 NeoForge 构建（AE2 官方 Fabric 移植到 19.x 止步），
# 所以这两家取 NeoForge jar 只做编译（javac 只认类名，不挑 loader）；
# 运行期 Fabric 上永远不会装它们，对应集成永远不会激活 —— 是死代码但无害。
# RS 与 Tom's Storage 有 Fabric 构建，是 Fabric 版「终端」App 的两家真实后端。
ae2_version=19.2.17
ae2wtlib_api_version=19.2.0
refinedstorage_version=2.0.9
toms_version=1.21-2.4.2-fabric

# AtomChat 的文件选择器（1.10.1-fabric.2 新增功能）用的观感库。
# 系统原生的 GetOpenFileName 弹窗压在 Minecraft 全屏窗口下面抬不起来，
# 所以选择器得是 JFileChooser + 自己的 JFrame；FlatLaf 给它现代外观
# （否则是 Swing 默认的灰色 Metal 风）。随 jar 内嵌，玩家不必单独装。
flatlaf_version=3.7.2
