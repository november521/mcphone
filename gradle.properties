# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
# 注意：这只是【编译】用的版本，不等于运行时要求的版本，后者见 neo_version_range。
neo_version=21.1.248
# 运行时接受的 NeoForge 版本范围，写进 neoforge.mods.toml 的 versionRange。
# 刻意与 neo_version 解耦：升级开发环境不应该把低版本玩家挡在门外。
# NeoForge 21.1.x 是稳定分支、API 只增不减，故编译版可高于下限；
# 但下限每次调整都必须用 -Pneo_version=<下限> 重编一遍来验证没用上新 API。
neo_version_range=[21.1.200,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=mcphone
# The human-readable display name for the mod.
mod_name=MCphone
# 模组许可证。这个值会写进 neoforge.mods.toml，游戏内的模组列表直接显示它。
# 必须与仓库根目录的 LICENSE 一致——两处对不上时，玩家看到的是哪一个取决于
# 他从哪儿看，而那正是本项目此前的毛病：游戏里写 All Rights Reserved，
# GitHub 上却因为没有 LICENSE 文件被扒成 "Other"。
mod_license=MIT
# MP3 解码库 JavaMP3 的版本。
# 纯 Java、无依赖、MIT 许可，GitHub 上唯一一个非 LGPL 的纯 Java MP3 解码器。
# 上游已于 2023 年归档——对一个 1993 年就冻结的格式来说，这比 API 客户端
# 停止维护的风险小得多；真出问题，MIT 许可让我们可以自己接手。
javamp3_version=1.0.1

# 模组版本号。
#
# ⚠【不要手动改这一行】。它归 .github/workflows/release.yml 管：发版时由 CI 算出
# 新号、写进这里、以 github-actions[bot] 的身份提交并打 tag。手改会被 build.yml
# 里的 guard-version 拦下，构建直接红。
#
# 为什么不让人改
#
# 这条规矩原先是"每个 commit 随手 +1"，写得很细，照样出事：攒出一串谁也没见过的
# 号，还因为分支合并往回走过 —— 1.10.1 到 1.10.4 之间出现过两个内容不同、
# mod_version 都写 1.10.1 的 commit。而这个值要烧进 jar、在游戏内模组列表里显示：
# 两个不同的包自称同一个版本，比不升号糟得多。
#
# 交给 CI 之后，仓库里这个值永远等于【最近一次真发出去的版本】，不再是一个
# 随时可能领先现实好几步的数。
#
# 怎么发版
#
#   Actions → Release → Run workflow，选一档：
#
#   大版本  破坏别人已经在用的契约，只有三样算：
#           IPhoneApp 等 SPI 接口去掉或改签名（wiki 的附属接口文档是公开的）、
#           换肤贴图路径作废（README 那张表公开过，老路径至今仍兼容）、
#           存档状态文件不再兼容（config/mcphone/installed/、笔记、聊天记录）。
#   次版本  【一整套完备的功能】做完才升。「阅读」App 从无到有（书城、搜索、
#           书架、模组适配）才算一套；里头任何单独一步都不算。
#   补丁号  其余一切：一个新功能点、修 bug、调布局、改美术、重构、构建脚本、
#           接口加一个带默认实现的方法。
#   custom  上面三档表达不了时才用，填完整的 x.y.z。
#
# 次版本刻意升得慢：版本号跳得比东西做出来的分量快，它就不再说明任何事情。
# 一个书架、一次白名单适配各占一个次版本，1.8 到 1.11 之间就只有一个 App 的
# 几个零件——那种号段读起来像做了很多，其实没有。拿不准就选 patch。
#
# 发版说明
#
# 平时把下一版的说明写进 docs/release-notes/next.md —— 版本号是 CI 现算的，
# 写的时候你并不知道自己写的是哪一版。发版时 release.yml 会把它改名成
# v<新版本>.md 一并提交。没有这个文件时 GitHub Release 会退回自动生成的提交
# 列表，那东西玩家读不懂，而且不会有人发现它退回过。
#
# 反面教材是 1.8.1 到 1.8.19：十九个补丁版一个字都没有，其中还夹着"新建世界开手机
# 一片空白"这种玩家真会撞上的 bug，最后只能靠 v1.8.20 那一版专门回头补账。
#
# 别的 Minecraft 版本各占一个分支（眼下是 1.20.1-forge），那边的 tag 带
# forge-v 前缀。tag 在 git 里是【仓库级】的、不属于任何分支，两支都用 v1.0.0
# 会撞名，所以只有主力这一支用不带前缀的形式。
mod_version=1.10.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.november.mcphone

# Curios（饰品栏，可选依赖）。手机挂腰上要用它。
# blamejared 上已无 1.21.1 构件，故走 Modrinth maven，坐标形如 maven.modrinth:curios:<version>。
curios_version=9.5.1+1.21.1

# Waystones（传送石碑，可选依赖）。传送石 App 要用它的选点菜单。
# 编译期版本不等于运行时下限：我们只用 WaystoneSelectionListBuilder、
# ModMenus.inventorySelection、TeleportFlags.INVENTORY_BUTTON 这几个存在很久的
# 东西，mods.toml 里的 versionRange 刻意放宽，别把用旧版的服主挡在门外。
waystones_version=21.1.41+neoforge-1.21.1

# MCEF（Minecraft Chromium Embedded Framework，可选依赖）。浏览器 App 要用它。
# 它把 Chromium 渲染成一张 GL 纹理交给我们，其余全是我们自己的事。
# 首次使用会下载对应平台的 java-cef 原生库（约 200 MB），由它自己带界面处理。
#
# 注意：它是【客户端】库。所有引用都关在 client/browser 包里，服务端一个字节
# 都不会碰到。
mcef_version=2.1.6-1.21.1
# NetMusic（网络音乐机）。版本号里的 + 是它自己的命名，不是 Gradle 的通配符，
# 照抄 Modrinth 上那一串即可（已实测这个坐标能解析）。
netmusic_version=1.5.1-neoforge+mc1.21.1

# Balm —— Waystones 的前置库，开菜单那一步走的是它的 networking()。
# 单独列出来是因为它是【独立模组】：Waystones 的 jar 里没有 Balm 的类，
# 只写 waystones 一个依赖，编译期就找不到 Balm.networking()。
balm_version=21.0.65+neoforge-1.21.1

# Patchouli（教程手册，可选依赖）。「阅读」App 要用它列出整合包里的所有手册，
# 并把翻书这件事原样交还给它。
#
# 编译对着 87 —— 这是【最老】的 1.21.1 可用版本（2024-09）。可选依赖挑版本
# 的方向和别处相反：往新编译、往旧运行会 NoSuchMethodError，反过来则几乎
# 不会出事，因为我们用的 BookRegistry.books、Book.name/getOwnerName/getIcon、
# openBookGUI 这几样从 1.16 起就没动过。整合包里装的是哪个补丁版本不由我们说了算，
# 所以取下限编译。
#
# 它是【客户端】用途：所有引用都关在 feature/reader/client 下，服务端碰不到。
# 不写 localRuntime：开发环境里一本书都没有，装上它只是多加载一个模组。
patchouli_version=1.21-87-neoforge

## 三家存储模组（可选依赖）——「终端」App 要用它们各自"替玩家打开这台终端"的入口
#
# 三家全是【软】前置：装了哪家就支持哪家，一家都没装时这一格不上主屏
# （TerminalApp.isAvailable）。下面这几个版本号只做两件事：拼 maven 坐标，
# 以及填 mods.toml 里 optional 依赖的下限 —— optional 的依赖【照样】会被强制
# 检查版本，玩家装了更低的版本是拒绝启动、不是悄悄降级，所以别随手往上抬。
#
# 三家对 NeoForge 的要求：AE2 [21.1.169,)、RS [21.1.181,)、Tom's [21.0.0-beta,)，
# 都低于本模组的下限，不会打架。

# AE2。⚠【不能】从 modmaven.dev 取：那边的 appeng 镜像停在 19.0.4-alpha
# （1.20.x 那一代），1.21.1 要的 19.2.x 一个都没有。走 Modrinth 官方 maven。
ae2_version=19.2.17

# GuideME —— AE2 自己的硬前置（它的 mods.toml 里写着 guideme [21.1.1,)）。
# 我们一行 GuideME 的代码都不碰，但两处都得有它：localRuntime 不放，开发环境
# 里 AE2 直接加载失败；compileOnly 不放，万一某个我们引用到的 AE2 类型的签名
# 里出现了 GuideME 的类，javac 会在解析父类型时报"找不到符号"，而那条错误信息
# 不会提到 GuideME。
guideme_version=21.1.17

# AE2WTLib（AE2 无线终端）。只要它的 api 模块（走 modmaven.dev），接触面只有
# ItemWT 一个类。
#
# 为什么非认它不可：它的终端也是 WirelessTerminalItem 的子类，但没覆盖 0 参的
# getMenuType()，走 AE2 的 openFromInventory 会开出【普通】ME 终端界面（没有
# 合成格）——不崩、不报错、玩家只看到一个少了格子的界面。见 Ae2wtlibSupport。
ae2wtlib_version=19.5.1

# Refined Storage 2。接的是 SlotReferenceHandlerItem ——"能被远程唤起的随身
# 物件"这个接口，无线网格、无线自动合成监视器、便携网格都实现了它。接口比继承
# 稳：别人给 RS 写的附属物件挂上这个接口也自动认得。
refinedstorage_version=2.0.9

# Tom's Simple Storage。【两个数，别合并】：它发布的文件叫
# toms-storage-1.21-2.4.2.jar（maven 坐标要这个），而它 mods.toml 里自报的
# version 是 2.4.2（依赖范围比的是这个）。写混了的表现是"装了它却说没装"，
# 或者 Gradle 根本解析不到依赖。
#
# 它只有【高级】无线终端能从手机上开：基础那把的 open() 方法体是一句 return，
# canOpen() 恒为 false，设计上就是"瞄准终端方块右键"。见 TomsStorageIntegration。
toms_version=1.21-2.4.2
toms_mod_version=2.4.2
