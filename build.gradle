plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}"
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files（上游 NeoForge 遗留，Fabric 无 datagen）
}

repositories {
    // Curios / Waystones / Balm / MCEF / NetMusic / Patchouli 等可选依赖走 Modrinth maven。
    // content 限定到 maven.modrinth 一个 group：不限定的话每解析一个依赖都要先来问它一次。
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Fabric Loom 必须的三件套
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // JavaMP3 —— MP3 解码，必需依赖。
    // NeoForge 侧用 jarJar，Fabric 侧用 include（fabric-loader 的 jar-in-jar）把它嵌进 jar，
    // 玩家不必单独装库。
    include implementation("fr.delthas:javamp3:${javamp3_version}")

    // === 可选联动依赖（编译期）—— 装了的就多一个 App/功能，没装则不出现 ===
    // 原 NeoForge 版的 Curios 在 1.21.1 Fabric 上没有构建，故不列（手机"挂腰"功能
    // 在 Fabric 版暂缺）。FTB Quests 走反射（FtbQuestsBook），无需编译依赖。
    modCompileOnly "maven.modrinth:waystones:21.1.42+fabric-1.21.1"
    modCompileOnly "maven.modrinth:balm:21.0.65+fabric-1.21.1"
    modCompileOnly "maven.modrinth:mcef:2.1.6-1.21.1"
    modCompileOnly "maven.modrinth:net-music:1.5.2-fabric+mc1.21.1"
    modCompileOnly "maven.modrinth:patchouli:1.21.1-93-fabric"
}

loom {
    // 单一源码集即可：客户端类已按包结构隔离（client/ 子包 + MCphoneClient），
    // 专用服务器不会实例化 ClientModInitializer，那些类也就不会被加载。
    runs {
        client { client() }
        server { server() }
    }
}

// fabric.mod.json 里的 ${version} 占位展开
processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// ============================================================
//  SPI 服务文件校验 —— 从 NeoForge 侧原样搬来：META-INF/services 里写的
// 每一个类，编译产物里必须真实存在。改名/搬包忘了同步这里，构建照常成功、
// 装上却空空如也且不报错。
// ============================================================
tasks.register('verifyServiceFiles') {
    description = '校验 META-INF/services 里写的类都真实存在'
    group = 'verification'

    dependsOn tasks.named('compileJava')

    def servicesDir = file('src/main/resources/META-INF/services')
    def classesDir = layout.buildDirectory.dir('classes/java/main')

    inputs.dir(servicesDir).optional()
    inputs.dir(classesDir).optional()

    doLast {
        if (!servicesDir.exists()) return

        def missing = []
        def total = 0
        servicesDir.eachFile { f ->
            f.eachLine('UTF-8') { line ->
                def cls = line.replaceAll('#.*', '').trim()
                if (cls.isEmpty()) return
                total++
                def classFile = classesDir.get().file(cls.replace('.', '/') + '.class').asFile
                if (!classFile.exists()) {
                    missing << "${f.name} -> ${cls}"
                }
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException(
                    "META-INF/services 里有 ${missing.size()} 个类不存在（多半是改名或搬包后忘了同步）:\n  "
                            + missing.join('\n  '))
        }
        logger.lifecycle("SPI 服务文件校验通过：${total} 个类全部存在")
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyServiceFiles') }

// ============================================================
//  dist 隔离校验 —— 从 NeoForge 侧原样搬来：路径里有 /client/ 的类才准引用
// 客户端类型。Fabric 专用服务器不加载 ClientModInitializer，但若某个非 client
// 包的类【常量池里写着】客户端类型，一旦被加载就会 NoClassDefFoundError。
// 这条规则在 Fabric 下同样成立，故保留。
// ============================================================
tasks.register('verifyDistIsolation') {
    description = '校验非 client 包的类没有引用客户端类型'
    group = 'verification'

    dependsOn tasks.named('compileJava')

    def clientMarkers = [
            'net/minecraft/client/',
            'com/mojang/blaze3d/',
            'com/cinemamod/mcef',
            'org/cef/',
            'net/fabricmc/fabric/api/client/',
    ]

    def allowed = [
            // 客户端入口，ClientModInitializer，服务端根本不会构造它
            'com/november/mcphone/MCphoneClient.class',
    ]

    def classesDir = layout.buildDirectory.dir('classes/java/main')
    inputs.dir(classesDir).optional()

    doLast {
        def root = classesDir.get().asFile
        if (!root.exists()) return

        def offenders = []
        def checked = 0

        root.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel.contains('/client/')) return          // 这些包本来就准
            if (rel.contains('/mixin/')) return           // mixin 包：本项目的 mixin 全部在 mcphone.mixins.json 的 client 数组里，服务端不会加载
            if (allowed.contains(rel)) return
            checked++

            def bytes = f.getBytes()
            def text = new String(bytes, 'ISO-8859-1')    // 逐字节，不解码
            def hit = clientMarkers.find { text.contains(it) }
            if (hit != null) {
                offenders << "${rel}  （引用了 ${hit}）"
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "dist 隔离被破坏：${offenders.size()} 个非 client 包的类引用了客户端类型。\n"
                            + "这些类一旦在专用服务器上被加载就会崩服/NoClassDefFoundError。\n  "
                            + offenders.join('\n  '))
        }
        logger.lifecycle("dist 隔离校验通过：${checked} 个非 client 类，无一引用客户端类型")
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyDistIsolation') }

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
