plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.54,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 17，不是 21。Minecraft 1.20.1 跑在 Java 17 上，用 21 编出来的 class 文件
// 版本低版本客户端加载不了——而且报的错不会提到 Java 版本。
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    // Curios 与 NetMusic 都发在 Modrinth 上，官方 maven 与发布同源。
    // 用 content 把它限定在 maven.modrinth 这一个 group：不限定的话，
    // 每解析一个依赖都要先来问它一次，构建平白慢一截。
    // javamp3 在中央仓库
    mavenCentral()

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

minecraft {
    // 官方混淆表。NeoForge 那一支用的是 Parchment（带参数名，读反编译代码舒服得多），
    // 这里先不上：Parchment 在 ForgeGradle 上要额外挂 librarian 插件，
    // 而这个工程眼下最需要的是"能稳定编过"。要加见 docs/PORTING.md。
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

repositories {
    mavenCentral()
}

// jarJar 的产物必须是【默认那一个】，否则会出事
//
// 开了 jarJar 之后 build/libs 下会有两个 jar：jar 任务出的那个不含内嵌依赖，
// jarJar 出的那个才含。两条 CI 都是 `find build/libs -name "*.jar" | head -1`
// 取件的 —— 那个 head -1 挑到谁完全看文件系统顺序，挑错就发出一个
// 放 mp3 必崩的包，而构建全绿、测试也全绿，没有任何东西会告诉你。
//
// 所以把没嵌依赖的那个改名带上 -slim，让它落在 CI 的排除名单里，
// 内嵌那个占住默认名字。两份 workflow 的 find 也一并加了 -slim 排除。
tasks.named('jar') {
    archiveClassifier = 'slim'
}
tasks.named('jarJar') {
    archiveClassifier = ''
}


dependencies {

    // Curios（饰品栏）—— 可选联动：装了就能把手机挂腰上，没装则一切照旧。
    //
    // compileOnly 而不是 implementation：只在运行时【如果】Curios 在场才去调它，
    // 编译期有类型就够了。写成 implementation 会把它变成必需品，没装的玩家
    // 直接加载失败。所有真调用都关在 CuriosCompat 的 *Internal 方法里，
    // 由 ModList 在外层判在不在场——那套隔离与 NeoForge 那一支逐字相同。
    //
    // fg.deobf 是 ForgeGradle 的规矩：Modrinth 上的是生产 jar，里面对 Minecraft
    // 的引用是 SRG 名，不过一遍 deobf 就与开发环境的官方混淆表对不上。
    // 【这一条与 NeoForge 那一支不同】，那边的 ModDevGradle 不需要。
    //
    // 不写运行期依赖：ForgeGradle 6 没有 localRuntime 这个配置（那是
    // ModDevGradle/NeoGradle 的东西）。真要跑饰品栏那条路，把 jar 手动丢进
    // run/mods 即可。
    compileOnly fg.deobf("maven.modrinth:curios:${curios_version}")

    // NetMusic（网络音乐机）—— 可选联动：装了就能把它刻出来的 CD 塞进唱片仓。
    //
    // 要当心的是它【没有对外的 API 包】：用到的 ItemMusicCD 在它的内部包里。
    // 所以接触面必须小，别顺手用它别的东西。它改版时断的地方越少越好，而断了
    // 会是 NoSuchMethodError 这类 Error —— 兼容层里兜的是 Throwable 不是
    // Exception，正是为了这个。
    compileOnly fg.deobf("maven.modrinth:net-music:${netmusic_version}")

    // Waystones（传送石碑）—— 可选联动：装了就多一个「传送石」App。
    //
    // 【与 NeoForge 那一支不是同一套 API】。那边用的 WaystoneSelectionListBuilder
    // 在 14.x 上不存在，ModMenus 里也没有 warpStoneSelection，"这次算哪种来源"
    // 改由 WarpMode 枚举表示。整条路是照着 14.x 的字节码重写的，逐条记在
    // WaystonesCompat 的类注释里。
    //
    // 编译对着【最老】的 1.20.1 可用版本 14.0.0：可选联动挑版本的方向和别处
    // 相反，往新编译、往旧运行会 NoSuchMethodError，反过来则几乎不会出事。
    // 用到的 createWaystoneSelection、WarpMode、WaystoneTeleportEvent.Pre、
    // IWaystoneTeleportContext.setWarpItem 从 14.0.0 到 14.1.20 签名一字未变，
    // 两头都核过。
    compileOnly fg.deobf("maven.modrinth:waystones:${waystones_version}")

    // Balm —— Waystones 的前置库，开菜单与挂事件走的都是它。
    //
    // 【必须单独列】：它是独立模组，Waystones 的 jar 里没有 net.blay09.mods.balm.*，
    // 只写 waystones 一条，编译期就找不到 Balm.getNetworking()。
    compileOnly fg.deobf("maven.modrinth:balm:${balm_version}")

    // MCEF —— 可选联动：装了就多一个「浏览器」App。它把 Chromium 渲染成一张
    // GL 纹理交给我们，贴四边形那一步是我们自己的事，而【那一步的 API 两边
    // 完全不同】，重写的就是它，见 BrowserScreen.drawBrowser。
    //
    // MCEF 自己的 API 两边一模一样，McefBackend 是逐字搬过来的。
    //
    // 不写运行期依赖：它首次运行要下载约 200 MB 的原生库，不该由一次
    // ./gradlew runClient 顺带触发。真要试浏览器，把 jar 手动丢进 run/mods。
    compileOnly fg.deobf("maven.modrinth:mcef:${mcef_version}")

    // Patchouli（教程手册）—— 可选联动：装了就多一个「阅读」App。
    //
    // 接触面里有三样是它的【内部】类，所以版本挑的是 1.20.1 上最老的那个，
    // 理由写在 gradle.properties 里。
    compileOnly fg.deobf("maven.modrinth:patchouli:${patchouli_version}")

    // ---- 「终端」App 的三家存储模组，全是可选联动：装了任意一家这一格才出现 ----
    //
    // 三条都编译对着【最老】的 1.20.1 release，理由与 Waystones 那条相同：
    // 往新编译、往旧运行会 NoSuchMethodError，反过来则几乎不会出事。
    // 用到的入口在各自的两头都核过字节码，记在各自的联动类注释里。

    // Applied Energistics 2 —— 无线终端、无线合成终端、无线样板访问终端。
    //
    // 【与 NeoForge 那一支不是同一代 API】。19.x 把"东西在哪儿"合成了一个
    // ItemMenuHostLocator；15.x 还是分开的两套（MenuLocator 开菜单，
    // IMenuItem.getMenuHost 只认背包槽位号），卡槽那条路因此要自己拼一个
    // WirelessTerminalMenuHost，见 TerminalSlotLocator。
    compileOnly fg.deobf("maven.modrinth:ae2:${ae2_version}")

    // AE2WTLib（AE2 无线终端）—— 可选联动里的可选联动。
    //
    // 【这边直接对整个模组 jar 编译，那边编的是 ae2wtlib_api 构件】：15.x 还没
    // 把 api 拆成单独的子包与单独的构件（de.mari_023.ae2wtlib.api.* 是后来才有
    // 的），modmaven 上也就没有 15.x 的 ae2wtlib_api。接触面仍然只有
    // Ae2wtlibSupport 一个类，与那边一样窄。
    compileOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")

    // Refined Storage —— 1.20.1 上是 1.12.x，也就是 RS【1】。
    //
    // 那边对的是 RS 2（2.0.x），两代之间 API 全换了。最要紧的一处后果是
    // RS 的终端在这一支上【装不进手机卡槽】——1.12 的 PlayerSlot 是个具体类，
    // 没有注册点。整段推理与实测见 RefinedStorageIntegration 的类注释。
    compileOnly fg.deobf("maven.modrinth:refined-storage:${refinedstorage_version}")

    // Tom's Simple Storage —— 高级无线终端。
    //
    // 三家里唯一一家两支逐字相同的：WirelessTerminal 那个接口在 1.6.1 与 2.4.2
    // 上是同样三个方法，基础无线终端的 open 仍是一句 return。
    compileOnly fg.deobf("maven.modrinth:toms-storage:${toms_version}")

    // JavaMP3 —— MP3 解码。【必需】依赖，不是可选联动。
    //
    // jarJar 而不是 implementation：模组 jar 不会自动带上第三方库，只写
    // implementation 的话开发环境跑得起来、发出去的 jar 一放 mp3 就
    // NoClassDefFoundError。这一条 PORTING.md 里原先列在"还没做的构建侧"。
    //
    // 区间写法是 jarJar 的要求：它要知道可接受的版本范围，好在多个模组都
    // 嵌了同一个库时挑一个共用，而不是各带各的。
    jarJar(implementation("fr.delthas:javamp3:[${javamp3_version},2.0)")) {
        jarJar.ranged(it, "[${javamp3_version},2.0)")
    }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 还没接的可选联动：FTB Quests。
    // 它在 1.20.1 上是另一套坐标与另一套 API，见 docs/PORTING.md。
}

// 整个代码库的注释与 mods.toml 的 description 都是中文，编码必须钉死。
//
// 不设的话 javac 与 Gradle 的资源过滤都走【平台默认编码】，而那个值在开发机
// 与 CI 上未必一样。第一次构建出来的 jar 里 description 就是
// "æä¸é¨è½ç¨çæºè½ææºå¡è¿ Minecraft" —— UTF-8 的字节被当成 Latin-1
// 读了一遍，模组列表里显示成一串乱码。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// mods.toml 里的版本号从 gradle.properties 来，两处各写一份必然会漂
tasks.named('processResources', ProcessResources).configure {
    // 这一行就是治乱码的那一行。expand 会把文件读进来再写出去，
    // 不指定字符集它用平台默认，中文必然翻车
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

// 打包后只留最新三个【版本】的 jar，别让 build/libs 越堆越多。
//
// 与 NeoForge 那一支的差别：那边一次构建只出一个 jar，"留最新三个文件"
// 就等于"留三个版本"。这边开了 jarJar 之后一次出两个（本体 + -slim），
// 照抄那条规则只够留一轮半 —— 上一个版本的 jar 会被留下来，
// 而 CI 若还按 find | head -1 取件就可能发出旧版本。
//
// 所以这里按【版本】分组再数。CI 那边也一并改成按确切文件名取，
// 两道各自独立，缺一道都还站得住。
// ============================================================
//  SPI 服务文件校验
// ============================================================
//
// META-INF/services/ 里写的是全限定类名，纯文本，编译器一个字都不看。类改名
// 或搬包之后忘了同步这里，构建照样成功，jar 照样能装——只是运行时 ServiceLoader
// 一个实现都找不到，手机里空空如也，而且不报错。
//
// 这个失败模式没有任何现成的东西挡得住，只能自己在构建期校验一遍：文件里写的
// 每一个类，编译产物里必须真的存在。
//
// 挂在 check 上而不是只在发版时跑：这种错要在本地 build 就炸出来，而不是等到
// CI 或者玩家装上之后。
//
// 与 NeoForge 那一支【逐字相同】：它校验的是自家的文本文件与自家的 class 目录，
// 两个都与加载器无关。
tasks.register('verifyServiceFiles') {
    description = '校验 META-INF/services 里写的类都真实存在'
    group = 'verification'

    dependsOn tasks.named('compileJava')

    def servicesDir = file('src/main/resources/META-INF/services')
    def classesDir = layout.buildDirectory.dir('classes/java/main')

    inputs.dir(servicesDir).optional()
    inputs.dir(classesDir).optional()

    doLast {
        if (!servicesDir.exists()) return

        def missing = []
        def total = 0
        servicesDir.eachFile { f ->
            f.eachLine('UTF-8') { line ->
                def cls = line.replaceAll('#.*', '').trim()
                if (cls.isEmpty()) return
                total++
                def classFile = classesDir.get().file(cls.replace('.', '/') + '.class').asFile
                if (!classFile.exists()) {
                    missing << "${f.name} -> ${cls}"
                }
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException(
                    "META-INF/services 里有 ${missing.size()} 个类不存在（多半是改名或搬包后忘了同步）:\n  "
                            + missing.join('\n  '))
        }
        logger.lifecycle("SPI 服务文件校验通过：${total} 个类全部存在")
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyServiceFiles') }

// ============================================================
//  dist 隔离校验
// ============================================================
//
// 专用服务器上没有客户端类。Forge 的 RuntimeDistCleaner 在加载
// net.minecraft.client.* 时直接抛异常——而触发它的不是"执行到了那句代码"，
// 是"JVM 校验那个类"。一个类只要【常量池里写着】客户端类型，哪怕那段代码被
// isClientSide() 挡得死死的、服务端永远执行不到，只要它在服务端被加载，
// 就会当场崩服。
//
// 这一支尤其需要它。NeoForge 那边客户端入口是 @Mod(dist = Dist.CLIENT) 的第二个
// mod 类，加载器保证专用服务端读都不读它；1.20.1 的 @Mod【没有 dist 参数】，
// 这条保险不存在，靠的是 MCphone 里那句 DistExecutor 加"签名里不出现客户端类型"
// 的自觉。自觉需要一道断言兜着。
//
// 规则一条：
//
//     路径里有 /client/ 的类才准引用客户端类型，其余一概不准。
//
// 校验直接在 .class 字节里搜常量池：类型名在常量池里以 modified-UTF8 存着，
// 原样搜字符串就够，不必解析 class 结构。这比读源码可靠——import 看不出
// 校验期会加载什么。
tasks.register('verifyDistIsolation') {
    description = '校验非 client 包的类没有引用客户端类型'
    group = 'verification'

    dependsOn tasks.named('compileJava')

    // 客户端专属的标记：常量池里出现这些就说明这个类碰了客户端
    def clientMarkers = [
            'net/minecraft/client/',
            'com/mojang/blaze3d/',
            'com/cinemamod/mcef',
            'org/cef/',
    ]

    // 白名单。加进来的每一条都要写清楚为什么它是安全的
    def allowed = [
            // 客户端入口。类名里有 Client 但路径里没有 /client/，规则扫不掉。
            // 它由 MCphone 经 DistExecutor 在客户端侧调起，专用服务端不会加载
            // ——见 MCphone 构造函数里那句双层 Supplier 的注释
            'com/november/mcphone/MCphoneClient.class',
    ]

    def classesDir = layout.buildDirectory.dir('classes/java/main')
    inputs.dir(classesDir).optional()

    doLast {
        def root = classesDir.get().asFile
        if (!root.exists()) return

        def offenders = []
        def checked = 0

        root.eachFileRecurse { f ->
            if (!f.name.endsWith('.class')) return
            def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel.contains('/client/')) return          // 这些包本来就准
            if (allowed.contains(rel)) return
            checked++

            def bytes = f.getBytes()
            def text = new String(bytes, 'ISO-8859-1')    // 逐字节，不解码
            def hit = clientMarkers.find { text.contains(it) }
            if (hit != null) {
                offenders << "${rel}  （引用了 ${hit}）"
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "dist 隔离被破坏：${offenders.size()} 个非 client 包的类引用了客户端类型。\n"
                            + "这些类一旦在专用服务器上被加载就会当场崩服。\n  "
                            + offenders.join('\n  '))
        }
        logger.lifecycle("dist 隔离校验通过：${checked} 个非 client 类，无一引用客户端类型")
    }
}

tasks.named('check').configure { dependsOn tasks.named('verifyDistIsolation') }

tasks.register('pruneOldJars') {
    doLast {
        var dir = layout.buildDirectory.dir('libs').get().asFile
        if (!dir.isDirectory()) return
        var jars = dir.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter) ?: []
        // mcphone-0.9.0.jar 与 mcphone-0.9.0-slim.jar 归到同一版本
        var byVersion = jars.groupBy { f ->
            var m = f.name =~ /^mcphone-(\d[^-]*)/
            m ? m[0][1] : f.name
        }
        var keep = byVersion.keySet().sort { a, b ->
            byVersion[b].max { it.lastModified() }.lastModified() <=>
            byVersion[a].max { it.lastModified() }.lastModified()
        }.take(3)
        byVersion.each { version, files ->
            if (!keep.contains(version)) {
                files.each {
                    println "删掉旧版本 jar：${it.name}"
                    it.delete()
                }
            }
        }
    }
}
tasks.named('build').configure { finalizedBy 'pruneOldJars' }

// ============================================================
//  断言测试
// ============================================================
//
// docs/ 下那几份 *Test.java 是带 main() 的独立断言测试。不用 JUnit 是因为
// 它们要的是【真实的 Minecraft 类路径】——NbtOps、FriendlyByteBuf、UUIDUtil
// 都是真货，测的就是"这些东西凑在一起对不对"，换成 mock 就什么都没测到。
// 每份自己数断言、自己汇总，失败时 System.exit(1)。
//
// 它们守的是没有别的守卫的地方：ChatMessage 的存档格式、GIF 拆帧、图片编码、
// 会话键、天气与世界时钟的取值，以及这一支特有的两份手写编解码往返测试
// （ChatImagePacketTest、WallpaperPacketTest —— 那一支是组合子拼的，写反了都难，
// 这边是读写两侧各写一遍的手写代码，中间没有任何东西保证它们对得上）。
// 这几样出事时都是静默的。
//
// 【问题是它们一直没进构建】。跑法写在各自的类注释里，靠人手动 javac + java
// 跑一遍——也就是说没人跑的时候，它们等于不存在。
//
// 现在挂在 check 上，跟着每一次 ./gradlew build 跑，CI 自动就带上了。
//
// docs/AddonApiExamples.java 没有 main()，所以只编不跑——而"编得过"本身就是
// 它该受的那道校验：对外 API 的示例代码不能是编不过的。

def assertTestsClasses = layout.buildDirectory.dir('classes/assert-tests')
// 递归而不是只扫顶层：把测试挪进子目录是个再自然不过的整理动作，而顶层写死的
// '*.java' 遇上它是【静默少跑几份】，不是报错。
def assertTestsSource = fileTree('docs') { include '**/*.java' }
def projectToolchain = java.toolchain

// 哪几份带 main()：读文件头现判，【不要】在这里维护一张手写清单。
// 加了一份测试却忘了往清单里补，症状是"构建绿的，但那份根本没跑"——
// 而这整节存在的理由，就是不再让"没人跑"这件事悄悄发生。
def assertTestMains = assertTestsSource.files.toSorted { it.name }.findResults { f ->
    def text = f.getText('UTF-8')
    // 修饰符顺序不固定（static public void main 一样合法），所以两个词分开断言，
    // 不写成一串固定顺序——写死的那种漏掉时也是静默的
    if (!(text =~ /(?m)^\s*(?=[^\n]*\bpublic\b)(?=[^\n]*\bstatic\b)[^\n]*\bvoid\s+main\s*\(/)) return null
    def pkg = (text =~ /(?m)^\s*package\s+([\w.]+)\s*;/)
    def simple = f.name - '.java'
    // 没写 package 的就是默认包，类名本身即全限定名。这里【不能】返回 null 悄悄丢掉它 ——
    // 那等于给这一节留了个"有测试但不跑"的后门
    (pkg ? "${pkg[0][1]}.${simple}" : simple).toString()
}

tasks.register('compileAssertTests', JavaCompile) {
    description = '编译 docs/ 下的断言测试与 API 示例'
    group = 'verification'

    source = assertTestsSource
    // 主源码的产物 + 它的编译类路径：与各测试类注释里那条手写的 javac 命令等价。
    // ForgeGradle 下 compileClasspath 里是【反混淆】过的 MC 与联动模组，正是手写
    // 那条命令用的同一批 jar。
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = assertTestsClasses
    javaCompiler = javaToolchains.compilerFor(projectToolchain)
}

// 一份测试一个 JavaExec 任务，而不是在 doLast 里 javaexec。
// 那一支写这一段时的直接理由是它开了配置缓存（doLast 里 javaexec 在配置缓存下不成立），
// 这一支【没开】org.gradle.configuration-cache，所以那条理由在这里不成立——但形状照抄，
// 理由换成两条仍然成立的：一份挂了 Gradle 报得出是哪一份，以及将来真开了配置缓存不用回头改。
def assertTestTasks = assertTestMains.collect { fqcn ->
    def simple = fqcn.substring(fqcn.lastIndexOf('.') + 1)
    tasks.register("assertTest${simple}", JavaExec) {
        description = "跑 ${simple}"
        group = 'verification'
        dependsOn tasks.named('compileAssertTests')
        classpath = files(assertTestsClasses, sourceSets.main.output, sourceSets.main.compileClasspath)
        mainClass = fqcn
        javaLauncher = javaToolchains.launcherFor(projectToolchain)
    }
}

tasks.register('assertTests') {
    description = '跑 docs/ 下所有带 main() 的断言测试'
    group = 'verification'
    dependsOn assertTestTasks

    def names = assertTestMains.collect { it.substring(it.lastIndexOf('.') + 1) }

    // 一份都没发现，绝不能当成"没有测试"就放行。
    //
    // 发现逻辑坏掉的方式不需要多离奇：docs/ 改个名、测试整体搬走、上面那个正则被
    // 一次格式化打断。而它坏掉之后 compileAssertTests 是 NO-SOURCE、这个任务没有
    // 任何依赖，check 照样全绿 —— 断言一条没跑，没有任何东西会告诉你。
    // 「手写清单漏一条」与「整张清单为空」是同一个病的两种得法，这一节两种都要堵。
    //
    // 放在 doFirst 而不是配置期：配置期抛会连 ./gradlew tasks 和 IDE 的工程同步
    // 一起打死，而这道断言只在"真要跑测试"时才有意义。挂在 check 上，CI 照样跑得到。
    doFirst {
        if (names.isEmpty()) {
            throw new GradleException(
                    'docs/ 下一份带 main() 的断言测试都没找到。\n' +
                    '这不是"没有测试"，是发现逻辑坏了：文件被挪走或改名，或者判 main() 的那个正则失效了。\n' +
                    '就这么放行的话 check 会全绿，而断言一条都没跑。')
        }
    }

    // 把"跑了几份、跑了哪几份"印出来。上面那条只挡得住"一份都没有"，
    // 少跑几份仍然是静默的 —— 这一行是留给人看的那道防线，CI 日志里翻得到
    doLast { logger.lifecycle("断言测试 ${names.size()} 份跑完：${names.join('、')}") }
}

tasks.named('check').configure { dependsOn tasks.named('assertTests') }
