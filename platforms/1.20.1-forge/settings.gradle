pluginManagement {
    repositories {
        gradlePluginPortal()
        // ForgeGradle 不在 Gradle 插件门户上，只在 Forge 自己的 maven 里
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    // 让 Gradle 在本机没有 JDK 17 时自动去下一个。1.20.1 跑在 17 上，
    // 而开发机上多半装的是更新的版本
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mcphone'
