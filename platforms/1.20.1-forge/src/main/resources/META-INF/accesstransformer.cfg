# MCphone 的访问转换器。目前只有一处。
# ⚠ 【这个文件里每一行要么是 "# 加文字"，要么是最下面那一行指令】——不留空行，也不留只有 #
# 的整行。这条格式约束是实测来的，不是洁癖：第一版按 neoforge 那份的样子写了十几行只有 #
# 的分隔行，CI 上 1.20.1-forge 当场红，日志里 32 条错误全都是同一个形状：
#   [main/ERROR]: Invalid access transformer line in accesstransformer.cfg: #
#   java.lang.IllegalArgumentException: Invalid AccessTransformer config, see log for details
# Forge 那个解析器（net.minecraftforge.accesstransformer.parser.AccessTransformerList）先 tokenize、
# 再要求 tokens.size() 落在 2..3 之间；只有 # 的整行切出来的 token 数恰好是 1，于是整行非法。
# 后果不是"注释被忽略"，是 AT 根本没应用：ForgeGradle 要的那条带 _at_<哈希> 后缀的依赖
# 生成不出来，:compileClasspath 直接解析失败。而带文字的 # 行全程一条错都没有 —— 所以这份
# 文件只写那一种形状。neoforge 那一份的解析器（ModDevGradle 那条路）不这样，它整份文件里
# 到处是 # 单独占的行、照样过。【两份不要互相抄】，这里的格式差异是加载器造成的，不是笔误。
# 【为什么要开放 KeyMapping 的 clickCount】
# 「快捷键触发」（feature/hotkey/client/）要在【不改模组、不按键、不模拟 GLFW】的前提下，
# 让某一个第三方模组的键位功能响一次。模组轮询的就是这个字段：它在自己的客户端 tick 里
# 写 while (myKey.consumeClick())，而 consumeClick() 只做一件事——把 clickCount 减一。
# 所以给它 +1，就等于替玩家按了那一下。
# 【为什么不调原版的 KeyMapping.click(Key)】
# 那个方法是【按「键」寻址】的：它走 KeyMappingLookup.getAll(key)，把该键上所有 mapping
# 一起 +1。一个键上被好几个模组分别绑了快捷键时，会全部一起触发——那正是这个功能要解决的
# 问题，不是它的实现方式。同样地，玩家如果把那个模组的键位解绑了（键位腾出来的场景，也正是
# 这个功能的初衷），按「键」就再也寻址不到它了。
# 所以这里要的是【按对象寻址】：拿到 mc.options.keyMappings 里那一个 KeyMapping 实例，
# 直接动它自己的计数器。原版没有公开的写入口，只能靠 AT 把字段放出来。
# 【为什么字段名写 f_90818_，不写 clickCount】
# Forge 官方文档《Access Transformers》在 Targets and Directives 一节里明写：
# 针对 Minecraft 的类做 AT 时，字段与方法必须写 SRG 名。因为 AT 作用在【方法名 / 字段名
# 还是 SRG】的那一份上，而类名已经是官方名（所以 net.minecraft.client.KeyMapping 照写）。
# 写成 mojmap 的 clickCount，这一行就匹配不到任何字段 —— 字段仍是 private，HotkeyBackend
# 编译时当场报 "clickCount has private access"，而这里看着毫无问题。
# 最硬的证据是 Forge 自己 1.20.1 的 KeyMapping 补丁：m_90835_（就是 click(Key)）体内那句
# 正是 ++keymapping.f_90818_ —— 字段与方法都写作 SRG 名，与上面那一节说的一致。
# neoforge 那一份写的是 clickCount —— 那边接的是 ModDevGradle，AT 的接法与本目标不同，
# 【这两行不要互相抄】。
# 【为什么是 public，不是 public-f】
# public 就够了：clickCount 不是 final，没有要去掉的 final 位。neoforge 那份写 public-f，
# 这里不需要多带一个 -f —— 带了也不会更对，只会让下一个人以为它在防什么。
# 【为什么不是 mixin】
# 这一处只要一个字段的可见性，AT 是它最短的路：这一行，加上 build.gradle 里那一行登记。
# 这个目标上一套 mixin 基建都没有（没有 mixin 依赖、没有 mixins.json、没有任何配置），
# 为"一个 int 字段的可见性"把整套东西引进来 = 多一个运行期 transformer、多一个会静默
# 失效的配置面，而它换来的东西 AT 一行就给完了。mixin 那条路留给已经有那套基建的目标。
# 【这个文件为什么必须放在 src/main/resources 里】
# 两个理由，缺一不可：
#   * ForgeGradle 6 不会自动发现 AT 文件，要在 build.gradle 的 minecraft{} 里用
#     accessTransformer = file(...) 登记（那一行的理由写在那个文件里）—— 这一条只管开发环境；
#   * 发布出去的 jar 里，Forge 只认 META-INF/accesstransformer.cfg 这一个【确切路径】
#     （Forge 官方文档同页明写 "Forge will only search for the exact path of
#     META-INF/accesstransformer.cfg in your JAR file"）。放到别处就是
#     "开发环境编得过、发出去装上之后字段又是私有的"。
public net.minecraft.client.KeyMapping f_90818_ # clickCount
