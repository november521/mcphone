# Minecraft 26.1.2 / ATM11 0.11.1-beta 移植配置。
# 身份与 mod_version 由仓库根 gradle.properties 提供，此处不得重定义。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# 使用较低的稳定公共 API 基线编译；运行时接受同一 Minecraft 26.1.2 的后续 NeoForge 版本。
neo_version=26.1.2.100
neo_version_range=[26.1.2.100,26.1.3)
loader_version_range=[1,)

# 嵌入的纯 Java 库，与 Minecraft 版本无关。
javamp3_version=1.0.1

# 下列八项与 ATM11 0.11.1-beta 锁定的 CurseForge 文件逐项核对过。
# 这里只声明编译依赖；联动源码及运行验收仍需完成，不等于兼容已完成。
curios_version=15.0.0+26.1.2
waystones_version=26.1.2.16+neoforge-26.1.2
balm_version=26.1.2.15+neoforge-26.1.2
patchouli_version=26.1-94-beta
ae2_version=26.1.13-beta
guideme_version=26.1.15-beta
ae2wtlib_version=26.1.1-beta
refinedstorage_version=3.2.1

# ATM11 未包含，但上游明确发布了 NeoForge 26.1.2 适用版本的可选联动。
netmusic_version=1.5.2-neoforge+mc26.1
toms_version=26.1-2.10.2
toms_mod_version=2.10.2

# 仅用于探测既有浏览器后端 API。未查到 26.1.2 发布，禁止作为运行依赖，
# 不据此声明浏览器兼容；正式适配需明确处理缺少上游版本的问题。
mcef_version=2.1.6-1.21.1
