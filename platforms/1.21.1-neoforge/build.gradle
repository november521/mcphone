plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// ============================================================
//  仓库级身份
// ============================================================
//
// mod_version / mod_id / mod_name / mod_license / mod_group_id 在【仓库根的
// gradle.properties】里，所有平台共用一份。
//
// 为什么不放在这儿：这个仓库一次发版要出好几个 Minecraft 版本 / 加载器的 jar，
// 而它们必须是同一个版本号 —— 玩家在两个版本上装到的 v1.11.0 得是同一次改动。
// 留在各平台里，它们就能各自漂移，而"老版本悄悄落后"正是这套目录结构要治的病。
//
// 【读不到就失败，不给默认值】。悄悄退回一个默认值等于把那个病放回来，而且是
// 静默的：jar 照样出得来，只是版本号对不上。
def repoRoot = file('../..')
def repoPropsFile = new File(repoRoot, 'gradle.properties')
if (!repoPropsFile.exists()) {
    throw new GradleException(
            "找不到 ${repoPropsFile.canonicalPath}。仓库级身份（mod_version 等）在那儿，" +
            "各平台不许自己定义。是不是把这个工程从仓库里单独拷出来了？")
}
def repoProps = new Properties()
repoPropsFile.withInputStream { repoProps.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_group_id', 'mod_version'].each { k ->
    if (!repoProps.containsKey(k)) {
        throw new GradleException("仓库根的 gradle.properties 缺 ${k}")
    }
    ext[k] = repoProps.getProperty(k)
}

version = mod_version
group = mod_group_id

// ============================================================
//  共享源码
// ============================================================
//
// 同一份代码要出好几个 Minecraft 版本 / 加载器的 jar。做法不是多分支，而是
// 【同一个分支、分块共用】：能共用的写在 shared/，各平台各自的写在自己这儿。
//
// 多分支的坏处是老版本永远慢半拍 —— 功能落在主力分支上，再靠一轮轮"追平"补过去，
// 而那一轮什么时候来没人保证。一个分支之后，一次发版就是全部版本各出一个 jar。
//
// 【各平台的 Gradle 不必相同】：这一支是 ModDevGradle + Java 21，1.20.1 那支要
// Java 17、Fabric 那支要 Loom。它们各建各的，由 CI 逐个跑，不必凑成一个构建。
//
// ⚠ 【拆分才刚起步】：shared/ 眼下只有 33 个 java，平台这边还有 240 个。
// 这不是最终形态 —— 那 240 个里的大头（服务端逻辑、数据、网络）本来就该进 shared，
// 只是边界得等第二个平台并进来才看得准，现在挤是猜。
//
// 头一批挑的是【已经有断言测试兜底】的那些纯逻辑类：ConversationKey、FriendGraph、
// Weather、Greeting、WorldClock、BookSearch、GifCodec、ChatImage —— 也就是 docs/
// 那批测试覆盖的对象。挪动它们出了错，assertTests 当场会红。
//
// 【共享层由配置文件说了算，不写死在这儿】
//
// versions/layers.json  有哪些层、各自的目录
// versions/targets.json 每个目标的 layers 字段：这个目标挂哪几层
//
// 这两行代码此后不用再动：加一个目标、加一层，都只改 JSON。
def layersFile  = new File(repoRoot, 'versions/layers.json')
def targetsFile = new File(repoRoot, 'versions/targets.json')
[layersFile, targetsFile].each { f ->
    if (!f.exists()) throw new GradleException("找不到 ${f} —— 共享层的声明在那儿，读不到就只能静默少接一层源码，而那是编译期才炸的错。")
}
def layers  = new groovy.json.JsonSlurper().parse(layersFile)
def targets = new groovy.json.JsonSlurper().parse(targetsFile)

// 认出自己是哪个目标：按 targets.json 里的 project 字段反查，不靠目录名猜。
// 目录挪了而 JSON 没跟着改，这里当场失败 —— 而不是安静地一层都不接。
def myPath = repoRoot.toPath().relativize(projectDir.toPath()).toString().replace(File.separator, '/')
def myEntry = targets.find { k, v -> v instanceof Map && v.project == myPath }
if (myEntry == null) {
    throw new GradleException(
            "versions/targets.json 里没有 project == \"${myPath}\" 的条目。\n" +
            "每个平台工程都要在那儿有一条，否则它挂哪几层共享代码就没人知道。")
}
def myLayers = myEntry.value.layers ?: []

sourceSets.main.java.srcDir '../../shared/src/main/java'
myLayers.each { name ->
    def spec = layers[name]
    if (spec == null) {
        throw new GradleException(
                "目标 ${myEntry.key} 声明挂了共享层 \"${name}\"，但 versions/layers.json 里没有它。\n" +
                "已有的层：${layers.findAll { k, v -> !k.startsWith('_') }.keySet().join('、')}")
    }
    def dir = new File(repoRoot, "${spec.dir}/src/main/java")
    if (!dir.isDirectory()) {
        throw new GradleException("共享层 \"${name}\" 的目录 ${dir} 不存在。layers.json 里写的是 ${spec.dir}。")
    }
    sourceSets.main.java.srcDir dir
}

sourceSets.main.resources {
    // 共享资源：贴图、模型、语言、音效、着色器，以及 SPI 服务声明。
    //
    // 【data/ 不在里头】—— 数据包的目录名本身就是版本专有的：1.21 把
    // recipes 改成 recipe、advancements 改成 advancement、tags/items 改成
    // tags/item。改错了不报错，只是那条配方/进度静默地不存在。
    srcDir('../../shared/src/main/resources')

    // 共享层的资源，同样按 layers 接。【data/ 正该放这儿】—— 数据包的目录名本身
    // 就是版本专有的（1.21 把 recipes 改成 recipe、advancements 改成 advancement、
    // tags/items 改成 tags/item），但它与加载器无关，同版本三个加载器共用一份。
    myLayers.each { name -> srcDir new File(repoRoot, "${layers[name].dir}/src/main/resources") }

    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // Curios（饰品栏）。作者的 maven.blamejared.com 上已经找不到 1.21.1 的
    // 构件了，Modrinth 官方 maven 有，且与 Modrinth 上的发布同源。
    // 用 content 把它限定在 maven.modrinth 这一个 group：不限定的话，
    // 每解析一个依赖都要先来问它一次，构建平白慢一截。
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // AE2WTLib 的 api 模块 —— 只有这一个 group 从这儿取。
    //
    // ⚠ AE2 本体【不能】从这儿取：modmaven 的 appeng 镜像停在 19.0.4-alpha，
    // 1.21.1 要的 19.2.x 一个都没有。
    maven {
        name = "modmaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "de.mari_023"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Curios —— 可选依赖：装了就能把手机挂在腰上，没装则一切照旧。
    //
    // compileOnly 而不是 implementation：我们只在运行时【如果】Curios 在场
    // 才去调它，编译期有类型就够了。写成 implementation 会把 Curios 变成
    // 必需品，没装的玩家直接加载失败。
    //
    // localRuntime 让开发环境的 runClient 真的装上 Curios，好把这条路径
    // 跑一遍；用它而不是 runtimeOnly，是为了不把这份依赖传播给下游。
    compileOnly "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"

    // Waystones（传送石碑）+ Balm —— 可选依赖：装了就多一个「传送石」App，
    // 没装则该 App 连应用商店里都不会出现。
    //
    // 同样是 compileOnly：所有调用都关在 WaystonesCompat 里，运行期由
    // ModList 判断在不在场。
    //
    // Balm 必须单独写一行。它是 Waystones 的前置【模组】而不是被打包进去的
    // 库，Waystones 的 jar 里没有 net.blay09.mods.balm.*——漏了这行，编译期
    // 就找不到 Balm.networking()，而错误信息只会说某个符号找不到，不会提示
    // 你少加了一个依赖。
    compileOnly "maven.modrinth:waystones:${waystones_version}"
    compileOnly "maven.modrinth:balm:${balm_version}"
    localRuntime "maven.modrinth:waystones:${waystones_version}"
    localRuntime "maven.modrinth:balm:${balm_version}"

    // MCEF —— 可选依赖：装了就多一个「浏览器」App，没装则该 App 不出现。
    //
    // 它是【客户端】库（把 Chromium 渲染成一张 GL 纹理）。所有引用都关在
    // client/browser 包里，服务端一个字节都不会碰到。
    //
    // 只写 compileOnly、不写 localRuntime：它首次运行要下载约 200 MB 的
    // java-cef 原生库，开发环境里每次 runClient 都可能触发，代价太大。真要跑
    // 浏览器时把 jar 手动丢进 run/mods 即可。
    compileOnly "maven.modrinth:mcef:${mcef_version}"

    // NetMusic（网络音乐机）—— 可选依赖：装了就能把它刻出来的 CD 塞进手机的
    // 唱片仓，走到哪儿放到哪儿、周围人都听得见；没装则唱片仓照旧只收原版唱片。
    //
    // 同样是 compileOnly：所有引用都关在 NetMusicCompat 与音乐那一支的客户端
    // 播放层里，运行期由 ModList 判断在不在场。
    //
    // 要当心的是它【没有对外的 API 包】：我们用到的 ItemMusicCD.getSongInfo
    // 与 MusicPlayManager.play 都在它的内部包里。所以接触面必须小 —— 只读
    // 一个数据组件、只调一个播放入口，别顺手用它别的东西。它改版时断的地方
    // 越少越好，而断了会是 NoSuchMethodError 这类 Error，兼容层里兜的是
    // Throwable 不是 Exception，正是为了这个。
    compileOnly "maven.modrinth:net-music:${netmusic_version}"
    localRuntime "maven.modrinth:net-music:${netmusic_version}"

    // Patchouli（教程手册）—— 可选依赖：装了就多一个「阅读」App，把整合包里
    // 所有教程书收进手机，没装则该 App 不出现。
    //
    // 同样是 compileOnly：所有引用都关在 feature/reader/client 下，运行期由
    // ModList 判断在不在场。
    //
    // 接触面刻意只有四样：BookRegistry.INSTANCE.books（有哪些书）、
    // Book 上的几个公开字段与 getOwnerName/getIcon（书名、出处、图标）、
    // PatchouliAPI.openBookGUI（翻书）。其中只有最后一个属于它的 api 包，
    // 前面几个是内部类——所以版本挑的是【最老】的那个，理由见 gradle.properties。
    //
    // 不写 localRuntime：开发环境里没有任何模组带书，装上它只会多加载一个模组，
    // 那条路径要真跑，把整合包里的 jar 丢进 run/mods 更接近现场。
    compileOnly "maven.modrinth:patchouli:${patchouli_version}"

    // 三家存储模组 —— 可选依赖：装了哪家，「终端」App 就能开哪家的终端；一家都
    // 没装时那一格不上主屏。全部引用都关在 feature/terminal/integration 下面，
    // 运行期在不在场由 ModList 判断，而判断只在 Terminals.discover() 那三行里。
    //
    // localRuntime 三家一起装：只有把它们真装在同一个开发环境里，才验得到
    // "同时装了两家""只装了一家"这些真实组合。嫌 runClient 沉就临时注掉，
    // 但发版前要三家都跑一遍。
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:ae2:${ae2_version}"

    // GuideME —— AE2 自己的前置，我们一行不碰。两处都要放，理由见 gradle.properties。
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"

    // AE2WTLib —— 编译期只要 api 模块（就一个 ItemWT 类型），运行期在开发环境里
    // 装整个模组，好把"装了它"那条路真跑一遍。
    compileOnly "de.mari_023:ae2wtlib_api:${ae2wtlib_version}"
    localRuntime "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"

    compileOnly "maven.modrinth:refined-storage:${refinedstorage_version}"
    localRuntime "maven.modrinth:refined-storage:${refinedstorage_version}"

    // 坐标上是 1.21-2.4.2，mods.toml 里自报的是 2.4.2 —— 两个数不一样，
    // 理由见 gradle.properties。
    compileOnly "maven.modrinth:toms-storage:${toms_version}"
    localRuntime "maven.modrinth:toms-storage:${toms_version}"

    // JavaMP3 —— MP3 解码。这是【必需】依赖，不是可选联动：玩家往音乐
    // 目录里丢一个 mp3，不该要求他再去装别的模组。
    //
    // jarJar 而不是 implementation：模组 jar 不会自动带上第三方库，只写
    // implementation 的话开发环境跑得起来、发出去的 jar 一运行就
    // NoClassDefFoundError。jarJar 把它嵌进 jar 里，由 NeoForge 在加载时
    // 展开；版本写成区间是 JarJar 的硬要求（它要在多个模组嵌了同一个库时
    // 挑一个满足所有人的版本）。
    //
    // 选它的理由：纯 Java、零依赖、MIT。GitHub 上纯 Java 的 MP3 解码器里，
    // 非 LGPL 的实际上只有它一个（JLayer 与 mp3spi 都是 LGPL，而 LGPL 的
    // 库嵌进要分发的 jar 里是个说不清的灰区）。
    jarJar(implementation("fr.delthas:javamp3:[${javamp3_version},2.0)"))

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 各平台共用的构建校验（SPI 服务文件、dist 隔离、断言测试、Java 17 兼容、旧 jar 清理）。
// 只写一次，见那个文件顶上的说明。
apply from: "${projectDir}/../../gradle/mcphone-checks.gradle"
