# MCphone 的访问转换器。目前只有一处。
#
# 【为什么要开放 KeyMapping 的 clickCount】
#
# 「快捷键触发」（feature/hotkey/client/）要在【不改模组、不按键、不模拟 GLFW】的前提下，
# 让某一个第三方模组的键位功能响一次。模组轮询的就是这个字段：它在自己的客户端 tick 里
# 写 while (myKey.consumeClick())，而 consumeClick() 只做一件事——把 clickCount 减一。
# 所以给它 +1，就等于替玩家按了那一下。
#
# 【为什么不调原版的 KeyMapping.click(Key)】
#
# 那个方法是【按「键」寻址】的：它走 MAP.getAll(key)，把该键上所有 mapping 一起 +1。
# 一个键上被好几个模组分别绑了快捷键时，会全部一起触发——那正是这个功能要解决的问题，
# 不是它的实现方式。同样地，玩家如果把那个模组的键位解绑了（键位腾出来的场景，也正是
# 这个功能的初衷），按「键」就再也寻址不到它了。
#
# 所以这里要的是【按对象寻址】：拿到 mc.options.keyMappings 里那一个 KeyMapping 实例，
# 直接动它自己的计数器。原版没有公开的写入口，只能靠 AT 把字段放出来。
#
# 【为什么不是 mixin】
#
# 这一处只要一个字段的可见性，AT 是它最短的路。mixin 那条路本仓也走得了
# （mixin/client/KeyMappingAccessor 用的就是同一种 accessor 手法，只是它开的是 key），
# 但 accessor 只在真实游戏里生效：docs/ 下那些断言测试是在纯 JVM 里跑的，要它们真的
# 能读写这个字段，用的就得是对编译期与运行期同时生效的那一种 —— 所以 fabric 走的是
# access widener，见 platforms/1.21.1-fabric/src/main/resources/mcphone.accesswidener。
#
# 【forge 那份的条目写法不一样】
#
# 同一个字段，那边写的是 SRG 名：public net.minecraft.client.KeyMapping f_90818_ # clickCount
#
# 两支的映射管道不同：ModDevGradle 认 mojmap 名（就是下面这一行），ForgeGradle 认 SRG 名。
# 名字不同不是笔误，别顺手把它们统一了 —— 一统一就有一边开了个不存在的字段，
# 而那种错只在 CI 上那一个目标的构建里现形。
public-f net.minecraft.client.KeyMapping clickCount
