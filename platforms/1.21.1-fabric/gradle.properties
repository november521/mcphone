# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 模组的身份（mod_id / mod_name / mod_license / mod_group_id / mod_version）
# 【不在】这个文件里 —— 那五个键归仓库根的 gradle.properties 管，所有目标共用
# 同一个版本号。这里的 build.gradle 会显式去读它，读不到就构建失败。

# Fabric 环境三件套
minecraft_version=1.21.1
# Fabric Loader。这个值由 1.21.1-Fabric 移植版在真实环境验过（2026-09-08 起
# 部署实测），targets.json 里那一行最初就是抄它的。
loader_version=0.19.5
# Fabric API。0.116.x 是 1.21.1 线的现行版本。
fabric_version=0.116.17+1.21.1

# fabric-loom。1.17.20 要求 Gradle >= 9.5，往上第一个能用的是 9.7.1
#（见 gradle-wrapper.properties，也见 targets.json 里 gradle 字段的来历）。
loom_version=1.17.20

# JavaMP3 —— 必需依赖，MP3 解码。Fabric 侧用 include 嵌进 jar（对应 NeoForge 的 jarJar）。
javamp3_version=1.0.1

# FlatLaf —— 文件选择器的观感（ImagePicker）。系统原生 GetOpenFileName 弹窗
# 压在 Minecraft 全屏窗口下面抬不起来，所以选择器是 JFileChooser + 自己的
# JFrame；FlatLaf 给它现代外观。与 javamp3 同样 include 内嵌。
flatlaf_version=3.7.2

# === 可选联动的编译期版本（Fabric 线）===
# 选版本的方向与别处相反：往新编译、往旧运行会 NoSuchMethodError，反过来几乎不出事。

# Waystones（传送石碑）与它的前置 Balm。都是 Fabric 构建。
waystones_version=21.1.42+fabric-1.21.1
balm_version=21.0.65+fabric-1.21.1

# MCEF（浏览器 App 的后端）。客户端库，所有引用关在 client/browser 包里。
mcef_version=2.1.6-1.21.1

# NetMusic（网络音乐机）。1.5.2 是它包名挪到 client.audio 之后的一代；
# 1.2.x 的旧包名由 NetMusicPlayback 的反射双包名兜住（见 shared/），所以
# 编译对 1.5.2、运行期 1.2.1 也能出声（部署环境实测）。
netmusic_version=1.5.2-fabric+mc1.21.1

# Patchouli（教程手册）。「阅读」App 要用它列出整合包里的手册。
patchouli_version=1.21.1-93-fabric

# === 「终端」App 的三家存储模组 ===
# AE2 与 ae2wtlib 在 1.21.1 上只有 NeoForge 构建：取 NeoForge jar 只为 javac
#（它已经是 Mojang 名，用 plain compileOnly，不交给 Loom remap）。
# 运行期 Fabric 上不存在，对应集成永远不会激活 —— 死代码但无害。
ae2_version=19.2.17
ae2wtlib_api_version=19.2.0
# RS 与 Tom's 有 Fabric 构建，是 Fabric 版「终端」的两家真实后端。
# 这两个 jar 是 intermediary 名，要 Loom remap，所以用 modCompileOnly。
refinedstorage_version=2.0.9
toms_version=1.21-2.4.2-fabric
