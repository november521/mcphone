modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
# 描述写在这儿而不是 gradle.properties —— 那个文件按规范是 ISO-8859-1 解码的，
# 中文放进去取出来就是乱码。理由写在 gradle.properties 里那段注释
description='''
把一部能用的智能手机塞进 Minecraft —— 拍照、翻相册、换壁纸、听歌、装 App，
还能给自己那一部手机起个名。

【这一支是 Forge 1.20.1 的移植骨架，功能尚未补齐。】能用的版本请用
Minecraft 1.21.1 + NeoForge 那一支。
'''

# 版本范围从 gradle.properties 来，不写死在这儿：两处各写一份必然会漂，
# 而漂了的后果是"玩家装的 Forge 明明够新，却被拦下"这种最难查的状态。
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"
